# Version: v1 debug
# Purpose:
# - Inspect the real Velociraptor schema for Windows PowerShell 4104 events.
# - Compare live watch_evtx with historical parse_evtx.
# - Test CU-009 regexes against a normalized ScriptText field before changing P3.

name: Custom.TFM.Debug.PowerShell4104.Raw_v1
description: |
  Debug artifact for TEC-009 / CU-009 PowerShell 4104 troubleshooting.

  This artifact is diagnostic only. It does not assert detection, does not route
  alerts, and does not use lab paths, script names, endpoint paths or technique
  labels as IOC.

  Sources:
  - PowerShell4104_WatchEvtx_Raw: live 4104 events from watch_evtx.
  - PowerShell4104_ParseEvtx_Backtest_Raw: historical/backtest 4104 events from parse_evtx.
  - PowerShell4104_Normalized_Test: regex test over normalized ScriptText.

type: CLIENT_EVENT

parameters:
  - name: PowerShellLog
    default: C:/Windows/System32/Winevt/Logs/Microsoft-Windows-PowerShell%4Operational.evtx
  - name: SinceMinutes
    default: 120
    type: int
  - name: UploadHttpRegex
    default: '(?i)(Invoke-WebRequest|\biwr\b|\bwget\b|\bcurl\b)'
    type: regex
  - name: UploadFileRegex
    default: '(?i)(-InFile\b|\bInFile\b)'
    type: regex
  - name: UploadPostRegex
    default: '(?i)(-Method\s+POST|\bMethod\s+POST\b|\bPOST\b)'
    type: regex
  - name: UploadZipContentRegex
    default: '(?i)(-ContentType\s+["'']?application/zip|application/zip)'
    type: regex
  - name: ZipFileRegex
    default: '(?i)\.zip(\s|["'']|$)'
    type: regex
  - name: HashEvidenceRegex
    default: '(?i)(Get-FileHash|SHA256|SHA1|MD5|LocalSHA256|FileHash)'
    type: regex
  - name: CryptoEncryptionRegex
    default: '(?i)(System\.Security\.Cryptography|AesManaged|AesCng|AES|CryptoStream|CreateEncryptor|CreateDecryptor|Rfc2898DeriveBytes|\.aes)'
    type: regex
  - name: DestructionStrongRegex
    default: '(?is)((Get-ChildItem|gci|dir|ls).*(Remove-Item|del\s+|erase\s+|rmdir\s+)|(Remove-Item|del\s+|erase\s+|rmdir\s+).*(-Force|-Recurse|\$_\.FullName|\$PSItem\.FullName))'
    type: regex

precondition: SELECT OS FROM info() WHERE OS = "windows"

sources:
  - name: PowerShell4104_WatchEvtx_Raw
    description: |
      Live raw 4104 inspection using watch_evtx. No detection regexes.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        atoi(string=System.EventID.Value) AS EventID,
        System.Provider.Name AS Provider,
        System.Channel AS Channel,
        serialize(item=EventData, format="json") AS EventDataJSON,
        serialize(item=System, format="json") AS SystemJSON,
        Message AS Message,
        EventData.ScriptBlockText AS EventData_ScriptBlockText,
        EventData.Data AS EventData_Data,
        EventData.PayloadData AS EventData_PayloadData,
        PayloadData AS PayloadData,
        EventData.ScriptBlockId AS EventData_ScriptBlockId,
        EventData.Path AS EventData_Path,
        EventData.UserId AS EventData_UserId,
        EventData.MessageNumber AS EventData_MessageNumber,
        EventData.MessageTotal AS EventData_MessageTotal,
        serialize(format="json", item=dict(
          System=System,
          EventData=EventData,
          Message=Message,
          PayloadData=PayloadData
        )) AS RawEventJSON
      FROM watch_evtx(filename=PowerShellLog)
      WHERE atoi(string=System.EventID.Value) = 4104

  - name: PowerShell4104_ParseEvtx_Backtest_Raw
    description: |
      Historical/backtest raw 4104 inspection using parse_evtx. No detection regexes.
      SinceMinutes limits the scan when supported by the event timestamp.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        atoi(string=System.EventID.Value) AS EventID,
        System.Provider.Name AS Provider,
        System.Channel AS Channel,
        serialize(item=EventData, format="json") AS EventDataJSON,
        serialize(item=System, format="json") AS SystemJSON,
        Message AS Message,
        EventData.ScriptBlockText AS EventData_ScriptBlockText,
        EventData.Data AS EventData_Data,
        EventData.PayloadData AS EventData_PayloadData,
        PayloadData AS PayloadData,
        EventData.ScriptBlockId AS EventData_ScriptBlockId,
        EventData.Path AS EventData_Path,
        EventData.UserId AS EventData_UserId,
        EventData.MessageNumber AS EventData_MessageNumber,
        EventData.MessageTotal AS EventData_MessageTotal,
        serialize(format="json", item=dict(
          System=System,
          EventData=EventData,
          Message=Message,
          PayloadData=PayloadData
        )) AS RawEventJSON
      FROM parse_evtx(filename=PowerShellLog)
      WHERE atoi(string=System.EventID.Value) = 4104
        AND (
          SinceMinutes <= 0
          OR System.TimeCreated.SystemTime > timestamp(epoch=now() - (SinceMinutes * 60))
        )

  - name: PowerShell4104_Normalized_Test
    description: |
      Live normalized 4104 test. Creates ScriptText from multiple candidate
      fields, then applies CU-009/CU-007/CU-008 regex checks against ScriptText.
    query: |
      SELECT
        DetectionTime,
        EventID,
        Provider,
        Channel,
        ScriptText =~ '(?s).' AS HasScriptText,
        ScriptText,
        ScriptText =~ UploadHttpRegex AS UploadHttpRegex,
        ScriptText =~ UploadFileRegex AS UploadFileRegex,
        ScriptText =~ UploadPostRegex AS UploadPostRegex,
        ScriptText =~ UploadZipContentRegex AS UploadZipContentRegex,
        ScriptText =~ HashEvidenceRegex AS HashEvidenceRegex,
        ScriptText =~ CryptoEncryptionRegex AS CryptoEncryptionRegex,
        ScriptText =~ DestructionStrongRegex AS DestructionStrongRegex,
        (
          (
            ScriptText =~ UploadHttpRegex
            AND ScriptText =~ UploadFileRegex
            AND ScriptText =~ UploadPostRegex
            AND ScriptText =~ UploadZipContentRegex
          )
          OR (
            ScriptText =~ ZipFileRegex
            AND ScriptText =~ UploadFileRegex
            AND ScriptText =~ UploadPostRegex
            AND ScriptText =~ UploadHttpRegex
          )
        )
        AND NOT ScriptText =~ CryptoEncryptionRegex AS CU009StrongCandidate,
        EventData_ScriptBlockText,
        Message,
        EventData_Data,
        EventData_PayloadData,
        PayloadData,
        EventDataJSON,
        RawEventJSON
      FROM foreach(
        row={
          SELECT
            System.TimeCreated.SystemTime AS DetectionTime,
            atoi(string=System.EventID.Value) AS EventID,
            System.Provider.Name AS Provider,
            System.Channel AS Channel,
            if(
              condition=EventData.ScriptBlockText,
              then=EventData.ScriptBlockText,
              else=if(
                condition=Message,
                then=Message,
                else=if(
                  condition=EventData.Data,
                  then=EventData.Data,
                  else=if(
                    condition=EventData.PayloadData,
                    then=EventData.PayloadData,
                    else=if(
                      condition=PayloadData,
                      then=PayloadData,
                      else=serialize(item=EventData, format="json")
                    )
                  )
                )
              )
            ) AS ScriptText,
            EventData.ScriptBlockText AS EventData_ScriptBlockText,
            EventData.Data AS EventData_Data,
            EventData.PayloadData AS EventData_PayloadData,
            PayloadData AS PayloadData,
            Message AS Message,
            serialize(item=EventData, format="json") AS EventDataJSON,
            serialize(format="json", item=dict(
              System=System,
              EventData=EventData,
              Message=Message,
              PayloadData=PayloadData
            )) AS RawEventJSON
          FROM watch_evtx(filename=PowerShellLog)
          WHERE atoi(string=System.EventID.Value) = 4104
        }
      )
