# Debug RAW Sysmon historical reader.
# Purpose: confirm Velociraptor can read Sysmon ID 1/3/11 via parse_evtx().
# No complex detection filters are applied.

name: Custom.TFM.Debug.Raw.Sysmon.ID1_3_11.LastHours
description: |
  Debug artifact for manual Hunt/Collection.
  Reads raw Sysmon Event ID 1, 3 and 11 from the last LookbackHours.
  Use this before P1/P2/P3 to verify process, network and file-create fields.

type: CLIENT

parameters:
  - name: LookbackHours
    default: 2
    type: int
  - name: SysmonEvtxPath
    default: 'C:\Windows\System32\winevt\Logs\Microsoft-Windows-Sysmon%4Operational.evtx'

precondition: SELECT OS FROM info() WHERE OS = "windows"

sources:
  - name: Raw_Sysmon_ID1_3_11_LastHours
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        System.Computer AS Hostname,
        atoi(string=System.EventID.Value) AS EventID,
        System.Provider.Name AS Provider,
        System.Channel AS Channel,
        System.EventRecordID.Value AS EventRecordID,
        EventData.Image AS Image,
        EventData.CommandLine AS CommandLine,
        EventData.ParentImage AS ParentImage,
        EventData.ParentCommandLine AS ParentCommandLine,
        EventData.TargetFilename AS TargetFilename,
        EventData.DestinationIp AS DestinationIp,
        EventData.DestinationPort AS DestinationPort,
        EventData.DestinationHostname AS DestinationHostname,
        EventData.User AS User,
        EventData.ProcessGuid AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        EventData.ParentProcessId AS ParentProcessId,
        EventData.Hashes AS Hashes,
        if(
          condition=Message =~ '(?s).',
          then=Message,
          else=serialize(item=EventData, format="json")
        ) AS MessageText,
        serialize(item=EventData, format="json") AS EventDataJSON,
        serialize(item=System, format="json") AS SystemJSON
      FROM parse_evtx(filename=SysmonEvtxPath)
      WHERE (
          atoi(string=System.EventID.Value) = 1
          OR atoi(string=System.EventID.Value) = 3
          OR atoi(string=System.EventID.Value) = 11
        )
        AND System.TimeCreated.SystemTime > timestamp(epoch=now() - (LookbackHours * 3600))
