        query={
          SELECT * FROM chain(
            jsonl={
              SELECT
                "JSONL_WRITE_ATTEMPT" AS Sink,
                JsonlPath AS Destination,
                ReturnCode,
                Stdout,
                Stderr,
                Timestamp,
                Hostname,
                ClientId,
                Artifact,
                Source,
                Profile,
                CU_ID,
                TEC,
                MITRE,
                Severity,
                Confidence,
                DetectionName
              FROM execve(argv=[
                "powershell.exe",
                "-NoProfile",
                "-NonInteractive",
                "-ExecutionPolicy", "Bypass",
                "-Command",
                "& { param([string]$p,[string]$b64) $json=[System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($b64)); $compact=($json | ConvertFrom-Json | ConvertTo-Json -Compress -Depth 20); $d=Split-Path -Parent $p; if (!(Test-Path -LiteralPath $d)) { New-Item -ItemType Directory -Path $d -Force | Out-Null }; Add-Content -LiteralPath $p -Value $compact -Encoding UTF8 }",
                JsonlPath,
                AlertB64
              ])
              WHERE EnableJSONL
            },
            discord={
              SELECT
                "DISCORD_POST_ATTEMPT" AS Sink,
                ReturnCode,
                Stdout,
                Stderr,
                Timestamp,
                Hostname,
                ClientId,
                Artifact,
                Source,
                Profile,
                CU_ID,
                TEC,
                MITRE,
                Severity,
                Confidence,
                DetectionName
              FROM execve(argv=[
                "powershell.exe",
                "-NoProfile",
                "-NonInteractive",
                "-ExecutionPolicy", "Bypass",
                "-Command",
                "& { param([string]$w,[string]$b64,[string]$u,[string]$footer) if ([string]::IsNullOrWhiteSpace($w)) { exit 0 }; $json=[System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($b64)); $a=$json | ConvertFrom-Json; $sev=[string]$a.Severity; $color=5793266; if($sev -match 'Critical'){ $color=10038562 } elseif($sev -match 'High'){ $color=15158332 } elseif($sev -match 'Medium'){ $color=16753920 }; $ioa=[string]$a.IOA; if($ioa.Length -gt 900){ $ioa=$ioa.Substring(0,900)+'...' }; $ioc=[string]$a.IOC; if($ioc.Length -gt 900){ $ioc=$ioc.Substring(0,900)+'...' }; $title='['+$sev+' / '+[string]$a.Confidence+'] '+[string]$a.CU_ID+' '+[string]$a.TEC+' - '+[string]$a.DetectionName; if($title.Length -gt 250){ $title=$title.Substring(0,250) }; $iocValue=$ioc; if([string]::IsNullOrWhiteSpace($iocValue)){ $iocValue='No atomic IOC; behavioral IOA' }; $fields=@(@{name='Timestamp'; value=[string]$a.Timestamp; inline=$true},@{name='Host / Client'; value=([string]$a.Hostname+' / '+[string]$a.ClientId); inline=$true},@{name='CU / TEC'; value=([string]$a.CU_ID+' / '+[string]$a.TEC); inline=$true},@{name='MITRE'; value=[string]$a.MITRE; inline=$true},@{name='Profile'; value=[string]$a.Profile; inline=$true},@{name='Source'; value=([string]$a.Source+' / EventID '+[string]$a.EventID); inline=$true},@{name='Artifact'; value=[string]$a.Artifact; inline=$false},@{name='IOA'; value=$ioa; inline=$false},@{name='IOC'; value=$iocValue; inline=$false},@{name='Action'; value=[string]$a.RecommendedAction; inline=$false}); $embed=[ordered]@{title=$title; description=[string]$a.RawEventSummary; color=$color; fields=$fields; footer=@{text=$footer}; timestamp=(Get-Date).ToUniversalTime().ToString('o')}; $payload=[ordered]@{username=$u; embeds=@($embed)}; $body=$payload | ConvertTo-Json -Depth 12 -Compress; Invoke-RestMethod -Uri $w -Method Post -ContentType 'application/json' -Body $body | Out-Null }",
                DiscordWebhook,
                AlertB64,
                DiscordUsername,
                DiscordFooter
              ])
              WHERE EnableDiscord
                AND DiscordWebhook =~ '(?i)^https://'
            }
          )
        }
      )

