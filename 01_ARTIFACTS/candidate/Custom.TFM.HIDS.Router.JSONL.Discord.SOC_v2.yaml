            p3_001={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P3.Medium.Behavioral.Event_v1/TEC001_PowerShell_4104" AS Artifact, Source, "P3" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, Evidence AS IOA, if(condition=Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=Evidence, else="") AS IOC, Severity, Confidence, AlertTitle AS DetectionName, Evidence, RecommendedAction, format(format="%v | %v | EventID=%v", args=[AlertDescription, SignalType, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P3.Medium.Behavioral.Event_v1/TEC001_PowerShell_4104") WHERE EnableP3 },
            p3_002={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P3.Medium.Behavioral.Event_v1/TEC002_CMD_Sysmon" AS Artifact, Source, "P3" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, Evidence AS IOA, if(condition=Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=Evidence, else="") AS IOC, Severity, Confidence, AlertTitle AS DetectionName, Evidence, RecommendedAction, format(format="%v | %v | EventID=%v", args=[AlertDescription, SignalType, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P3.Medium.Behavioral.Event_v1/TEC002_CMD_Sysmon") WHERE EnableP3 },
            p3_003={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P3.Medium.Behavioral.Event_v1/TEC003_ScheduledTask_Sysmon" AS Artifact, Source, "P3" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, Evidence AS IOA, if(condition=Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=Evidence, else="") AS IOC, Severity, Confidence, AlertTitle AS DetectionName, Evidence, RecommendedAction, format(format="%v | %v | EventID=%v", args=[AlertDescription, SignalType, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P3.Medium.Behavioral.Event_v1/TEC003_ScheduledTask_Sysmon") WHERE EnableP3 },
