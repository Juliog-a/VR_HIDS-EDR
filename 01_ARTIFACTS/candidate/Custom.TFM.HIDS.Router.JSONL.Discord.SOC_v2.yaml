            p2_009_net={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P2.High.Forensic_v1/CU009_Source_HTTP_Network_Sysmon_Context" AS Artifact, Channel AS Source, "P2" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, CU_Evidence AS IOA, if(condition=CU_Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=CU_Evidence, else="") AS IOC, Severity, Confidence, AlertName AS DetectionName, CU_Evidence AS Evidence, "Network context only; absence/presence does not replace 4104 evidence." AS RecommendedAction, format(format="%v | %v | EventID=%v", args=[CU_Reason, DetectionLogic, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P2.High.Forensic_v1/CU009_Source_HTTP_Network_Sysmon_Context") WHERE EnableP2 },
