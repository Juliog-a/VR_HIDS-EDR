# Version: SOC_v2 candidate
# Purpose:
# - SERVER_EVENT router for final TFM SOC alerts.
# - Consumes already-generated CLIENT_EVENT rows from P1/P2/P3/P4 via watch_monitoring().
# - Routes normalized SOC alerts to JSONL and optional Discord.
# - This artifact does not detect host telemetry.
# - Discord webhook is intentionally empty and must be provided at deployment.

name: Custom.TFM.HIDS.Router.JSONL.Discord.SOC_v2
description: |
  SOC-style SERVER_EVENT router for the TFM Velociraptor HIDS/DFIR final iteration.

  Function:
  - Listen to P1/P2/P3/P4 CLIENT_EVENT artifacts.
  - Normalize heterogeneous alert rows into a SOC alert schema.
  - Persist normalized alerts to JSONL.
  - Optionally send Discord webhook notifications with SOC-oriented fields.

  Important:
  - CLIENT_EVENT artifacts detect.
  - This SERVER_EVENT artifact routes, enriches, persists and notifies only.
  - JSONL and Discord are outputs, not detection evidence by themselves.
  - P2 support targets the deployed artifact Custom.TFM.HIDS.P2.High.Forensic_v1.

required_permissions:
  - EXECVE

type: SERVER_EVENT

parameters:
  - name: EnableP1
    type: bool
    default: true
    description: "Route legacy P1 Low.Basic.Event_v1 sources."

  - name: EnableP1Critical
    type: bool
    default: false
    description: "Route renamed P1 Critical.Priority.Event_v1 sources. Disable legacy P1 if both are deployed to avoid duplicates."

  - name: EnableP2
    type: bool
    default: true
    description: "Route P2 High Forensic v1 sources for CU-007/CU-008/CU-009."

  - name: EnableP3
    type: bool
    default: true
    description: "Route P3 Medium Behavioral EVENT v1 sources."

  - name: EnableP4
    type: bool
    default: true
    description: "Route P4 Low Basic v2 sources."

  - name: EnableJSONL
    type: bool
    default: true

  - name: JsonlPath
    default: '\\VBOXSVR\Carpeta_Compartida_TFM\inbox\soc_alerts.jsonl'

  - name: EnableDiscord
    type: bool
    default: false

  - name: DiscordWebhook
    default: ''
    description: "Paste the Discord webhook URL only when deploying/running this artifact."

  - name: DiscordUsername
    default: 'TFM Velociraptor SOC'

  - name: DiscordFooter
    default: 'TFM Velociraptor HIDS/DFIR - SERVER_EVENT router'

  - name: SeverityRegex
    type: regex
    default: '(?i).*'

  - name: ConfidenceRegex
    type: regex
    default: '(?i).*'

  - name: IncludeContextOnly
    type: bool
    default: true

  - name: ExcludeRouterSelfEvents
    type: bool
    default: true

  - name: RouterSelfEventRegex
    type: regex
    default: '(?i)(alerts\.jsonl|soc_alerts\.jsonl|FromBase64String|Add-Content|RouterArtifact|JSONL_WRITE_ATTEMPT|DISCORD_POST_ATTEMPT|Carpeta_Compartida_TFM|Invoke-RestMethod.+webhook)'

sources:
  - name: Route_SOC_Alerts_JSONL_Discord
    description: |
      Normalize P1/P2/P3/P4 EVENT alerts into SOC schema, write JSONL and
      optionally send Discord webhook notifications.
    query: |
      SELECT * FROM foreach(
        row={
          SELECT
            Timestamp,
            DetectionTime,
            Hostname,
            ClientId,
            Artifact,
            Source,
            Profile,
            CU_ID,
            TEC,
            MITRE,
            IOA,
            IOC,
            if(condition=Severity =~ '(?s).+', then=Severity, else="MEDIUM") AS Severity,
            if(condition=Confidence =~ '(?s).+', then=Confidence, else="MEDIUM") AS Confidence,
            DetectionName,
            Evidence,
            if(condition=RecommendedAction =~ '(?s).+', then=RecommendedAction, else="Review source telemetry, correlate with campaign summary and preserve evidence.") AS RecommendedAction,
            RawEventSummary,
            SignalType,
            EventID,
            base64encode(string=serialize(format="json", item=dict(
              Schema="TFM_SOC_ALERT_v2",
              Timestamp=Timestamp,
              DetectionTime=DetectionTime,
              Hostname=Hostname,
              ClientId=ClientId,
              Artifact=Artifact,
              Source=Source,
              Profile=Profile,
              CU_ID=CU_ID,
              TEC=TEC,
              MITRE=MITRE,
              IOA=IOA,
              IOC=IOC,
              Severity=if(condition=Severity =~ '(?s).+', then=Severity, else="MEDIUM"),
              Confidence=if(condition=Confidence =~ '(?s).+', then=Confidence, else="MEDIUM"),
              DetectionName=DetectionName,
              Evidence=Evidence,
              RecommendedAction=if(condition=RecommendedAction =~ '(?s).+', then=RecommendedAction, else="Review source telemetry, correlate with campaign summary and preserve evidence."),
              RawEventSummary=RawEventSummary,
              SignalType=SignalType,
              EventID=EventID,
              RouterArtifact="Custom.TFM.HIDS.Router.JSONL.Discord.SOC_v2"
            ))) AS AlertB64
          FROM chain(
            p1_legacy_4104={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P1.Low.Basic.Event_v1/P1_EVENT_PowerShell4104_Basic" AS Artifact, Source, "P1_LEGACY" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, Evidence AS IOA, if(condition=Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=Evidence, else="") AS IOC, Severity, Confidence, AlertTitle AS DetectionName, Evidence, RecommendedAction, format(format="%v | %v | EventID=%v", args=[AlertDescription, SignalType, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P1.Low.Basic.Event_v1/P1_EVENT_PowerShell4104_Basic") WHERE EnableP1 },
            p1_legacy_sysmon={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P1.Low.Basic.Event_v1/P1_EVENT_Sysmon_ID1_Process_Basic" AS Artifact, Source, "P1_LEGACY" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, Evidence AS IOA, if(condition=Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=Evidence, else="") AS IOC, Severity, Confidence, AlertTitle AS DetectionName, Evidence, RecommendedAction, format(format="%v | %v | EventID=%v", args=[AlertDescription, SignalType, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P1.Low.Basic.Event_v1/P1_EVENT_Sysmon_ID1_Process_Basic") WHERE EnableP1 },
            p1_legacy_system={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P1.Low.Basic.Event_v1/P1_EVENT_System7045_ServiceCreation" AS Artifact, Source, "P1_LEGACY" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, Evidence AS IOA, if(condition=Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=Evidence, else="") AS IOC, Severity, Confidence, AlertTitle AS DetectionName, Evidence, RecommendedAction, format(format="%v | %v | EventID=%v", args=[AlertDescription, SignalType, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P1.Low.Basic.Event_v1/P1_EVENT_System7045_ServiceCreation") WHERE EnableP1 },
            p1_legacy_009={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P1.Low.Basic.Event_v1/P1_EVENT_TEC009_Sysmon_Context" AS Artifact, Source, "P1_LEGACY" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, Evidence AS IOA, if(condition=Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=Evidence, else="") AS IOC, Severity, Confidence, AlertTitle AS DetectionName, Evidence, RecommendedAction, format(format="%v | %v | EventID=%v", args=[AlertDescription, SignalType, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P1.Low.Basic.Event_v1/P1_EVENT_TEC009_Sysmon_Context") WHERE EnableP1 },

            p1_critical_4104={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P1.Critical.Priority.Event_v1/P1_EVENT_PowerShell4104_Basic" AS Artifact, Source, "P1_CRITICAL" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, Evidence AS IOA, if(condition=Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=Evidence, else="") AS IOC, Severity, Confidence, AlertTitle AS DetectionName, Evidence, RecommendedAction, format(format="%v | %v | EventID=%v", args=[AlertDescription, SignalType, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P1.Critical.Priority.Event_v1/P1_EVENT_PowerShell4104_Basic") WHERE EnableP1Critical },
            p1_critical_sysmon={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P1.Critical.Priority.Event_v1/P1_EVENT_Sysmon_ID1_Process_Basic" AS Artifact, Source, "P1_CRITICAL" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, Evidence AS IOA, if(condition=Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=Evidence, else="") AS IOC, Severity, Confidence, AlertTitle AS DetectionName, Evidence, RecommendedAction, format(format="%v | %v | EventID=%v", args=[AlertDescription, SignalType, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P1.Critical.Priority.Event_v1/P1_EVENT_Sysmon_ID1_Process_Basic") WHERE EnableP1Critical },
            p1_critical_system={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P1.Critical.Priority.Event_v1/P1_EVENT_System7045_ServiceCreation" AS Artifact, Source, "P1_CRITICAL" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, Evidence AS IOA, if(condition=Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=Evidence, else="") AS IOC, Severity, Confidence, AlertTitle AS DetectionName, Evidence, RecommendedAction, format(format="%v | %v | EventID=%v", args=[AlertDescription, SignalType, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P1.Critical.Priority.Event_v1/P1_EVENT_System7045_ServiceCreation") WHERE EnableP1Critical },
            p1_critical_009={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P1.Critical.Priority.Event_v1/P1_EVENT_TEC009_Sysmon_Context" AS Artifact, Source, "P1_CRITICAL" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, Evidence AS IOA, if(condition=Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=Evidence, else="") AS IOC, Severity, Confidence, AlertTitle AS DetectionName, Evidence, RecommendedAction, format(format="%v | %v | EventID=%v", args=[AlertDescription, SignalType, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P1.Critical.Priority.Event_v1/P1_EVENT_TEC009_Sysmon_Context") WHERE EnableP1Critical },

            p2_007_4104={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P2.High.Forensic_v1/CU007_Source_RansomwareLike_Encryption_4104" AS Artifact, Channel AS Source, "P2" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, CU_Evidence AS IOA, if(condition=CU_Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=CU_Evidence, else="") AS IOC, Severity, Confidence, AlertName AS DetectionName, CU_Evidence AS Evidence, "Review forensic fields and correlate with generated file evidence." AS RecommendedAction, format(format="%v | %v | EventID=%v", args=[CU_Reason, DetectionLogic, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P2.High.Forensic_v1/CU007_Source_RansomwareLike_Encryption_4104") WHERE EnableP2 },
            p2_007_file={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P2.High.Forensic_v1/CU007_Source_Encrypted_FileCreate_Sysmon_Optional" AS Artifact, Channel AS Source, "P2" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, CU_Evidence AS IOA, if(condition=CU_Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=CU_Evidence, else="") AS IOC, Severity, Confidence, AlertName AS DetectionName, CU_Evidence AS Evidence, "Use as supporting file-create context for CU-007." AS RecommendedAction, format(format="%v | %v | EventID=%v", args=[CU_Reason, DetectionLogic, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P2.High.Forensic_v1/CU007_Source_Encrypted_FileCreate_Sysmon_Optional") WHERE EnableP2 },
            p2_008_4104={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P2.High.Forensic_v1/CU008_Source_Sabotage_Destruction_4104" AS Artifact, Channel AS Source, "P2" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, CU_Evidence AS IOA, if(condition=CU_Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=CU_Evidence, else="") AS IOC, Severity, Confidence, AlertName AS DetectionName, CU_Evidence AS Evidence, "Review deletion scope and correlate with runner summary." AS RecommendedAction, format(format="%v | %v | EventID=%v", args=[CU_Reason, DetectionLogic, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P2.High.Forensic_v1/CU008_Source_Sabotage_Destruction_4104") WHERE EnableP2 },
            p2_008_proc={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P2.High.Forensic_v1/CU008_Source_Sabotage_Destruction_Sysmon_Process" AS Artifact, Channel AS Source, "P2" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, CU_Evidence AS IOA, if(condition=CU_Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=CU_Evidence, else="") AS IOC, Severity, Confidence, AlertName AS DetectionName, CU_Evidence AS Evidence, "Use as process context for CU-008." AS RecommendedAction, format(format="%v | %v | EventID=%v", args=[CU_Reason, DetectionLogic, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P2.High.Forensic_v1/CU008_Source_Sabotage_Destruction_Sysmon_Process") WHERE EnableP2 },
            p2_008_delete={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P2.High.Forensic_v1/CU008_Source_FileDelete_Sysmon26_Forensic" AS Artifact, Channel AS Source, "P2" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, CU_Evidence AS IOA, if(condition=CU_Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=CU_Evidence, else="") AS IOC, Severity, Confidence, AlertName AS DetectionName, CU_Evidence AS Evidence, "Forensic context only; correlate with CU-008 4104/process evidence." AS RecommendedAction, format(format="%v | %v | EventID=%v", args=[CU_Reason, DetectionLogic, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P2.High.Forensic_v1/CU008_Source_FileDelete_Sysmon26_Forensic") WHERE EnableP2 },
            p2_009_4104={ SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId, "Custom.TFM.HIDS.P2.High.Forensic_v1/CU009_Source_Staging_ZIP_HTTP_Upload_4104" AS Artifact, Channel AS Source, "P2" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE, CU_Evidence AS IOA, if(condition=CU_Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=CU_Evidence, else="") AS IOC, Severity, Confidence, AlertName AS DetectionName, CU_Evidence AS Evidence, "Validate receiver logs and ZIP hash if available; 4104 is primary evidence." AS RecommendedAction, format(format="%v | %v | EventID=%v", args=[CU_Reason, DetectionLogic, EventID]) AS RawEventSummary, SignalType, EventID FROM watch_monitoring(artifact="Custom.TFM.HIDS.P2.High.Forensic_v1/CU009_Source_Staging_ZIP_HTTP_Upload_4104") WHERE EnableP2 },
