# Version: SOC_v3 candidate
# Purpose:
# - SERVER_EVENT router for final TFM SOC alerts.
# - Consumes already-generated CLIENT_EVENT rows via watch_monitoring().
# - Routes P1 Critical, P2 Event, P3 Event and P4 v2.
# - Uses one router source per monitored source to avoid blocking on long-lived watchers.
# - This artifact does not detect host telemetry.

name: Custom.TFM.HIDS.Router.JSONL.Discord.SOC_v3
description: |
  SOC-style SERVER_EVENT router for the TFM Velociraptor HIDS/DFIR final iteration.

  Function:
  - Listen to P1/P2/P3/P4 CLIENT_EVENT artifacts using watch_monitoring().
  - Normalize heterogeneous rows into a SOC alert schema.
  - Persist normalized alerts to JSONL.
  - Optionally send Discord webhook notifications with SOC-oriented fields.

  Important:
  - CLIENT_EVENT artifacts detect.
  - This SERVER_EVENT artifact only routes, enriches, persists and notifies.
  - JSONL and Discord are outputs, not detection evidence by themselves.
  - v3 avoids a single chain() with many infinite watch_monitoring() branches.

required_permissions:
  - EXECVE

type: SERVER_EVENT

parameters:
  - name: EnableP1Critical
    type: bool
    default: true
    description: "Route P1 Critical.Priority.Event_v1 sources currently deployed in Label All."

  - name: EnableP1
    type: bool
    default: false
    description: "Reserved compatibility flag for legacy P1 Low.Basic.Event_v1. SOC_v3 routes P1 Critical by default."

  - name: EnableP2Event
    type: bool
    default: true
    description: "Route Custom.TFM.HIDS.P2.High.Forensic.Event_v1 sources."

  - name: EnableP2Legacy
    type: bool
    default: false
    description: "Reserved compatibility flag for old Custom.TFM.HIDS.P2.High.Forensic_v1 deployments. SOC_v3 targets P2 Event v1."

  - name: EnableP3
    type: bool
    default: true
    description: "Route P3 Medium Behavioral EVENT v1 sources."

  - name: EnableP4
    type: bool
    default: true
    description: "Route P4 Low Basic v2 sources."

  - name: EnableJSONL
    type: bool
    default: true

  - name: JsonlPath
    default: '\\VBOXSVR\Carpeta_Compartida_TFM\inbox\soc_alerts.jsonl'

  - name: EnableDiscord
    type: bool
    default: false

  - name: DiscordWebhook
    default: ''
    description: "Paste the Discord webhook URL only when deploying/running this artifact."

  - name: DiscordUsername
    default: 'TFM Velociraptor SOC'

  - name: DiscordFooter
    default: 'TFM Velociraptor HIDS/DFIR - SERVER_EVENT router SOC_v3'

  - name: SeverityRegex
    type: regex
    default: '(?i).*'

  - name: ConfidenceRegex
    type: regex
    default: '(?i).*'

  - name: IncludeContextOnly
    type: bool
    default: true

  - name: ExcludeRouterSelfEvents
    type: bool
    default: false
    description: "Default false for initial validation. Enable later if router self-events become noisy."

  - name: RouterSelfEventRegex
    type: regex
    default: '(?i)(alerts\.jsonl|soc_alerts\.jsonl|FromBase64String|Add-Content|RouterArtifact|JSONL_WRITE_ATTEMPT|DISCORD_POST_ATTEMPT|Invoke-RestMethod.+webhook)'

sources:
  - name: Route_P1Critical_PowerShell4104_Basic
    description: "Route P1 Critical 4104 basic alerts."
    query: |
      SELECT * FROM foreach(row={
        SELECT timestamp(epoch=now()) AS Timestamp, DetectionTime, Hostname, ClientId,
          "Custom.TFM.HIDS.P1.Critical.Priority.Event_v1/P1_EVENT_PowerShell4104_Basic" AS Artifact,
          Source, "P1_CRITICAL" AS Profile, CU_ID, ID_Tecnica_Interna AS TEC, MITRE_ID AS MITRE,
          Evidence AS IOA, if(condition=Evidence =~ '(?i)(https?://|\\\\|[A-Z]:\\|\.zip|\.aes|\.exe|\.ps1|\b\d{1,3}(\.\d{1,3}){3}\b|8088)', then=Evidence, else="") AS IOC,
          if(condition=Severity =~ '(?s).+', then=Severity, else="MEDIUM") AS Severity,
          if(condition=Confidence =~ '(?s).+', then=Confidence, else="MEDIUM") AS Confidence,
          AlertTitle AS DetectionName, Evidence,
          if(condition=RecommendedAction =~ '(?s).+', then=RecommendedAction, else="Review the matching event and correlate with campaign summary.") AS RecommendedAction,
          format(format="%v | %v | EventID=%v", args=[AlertDescription, SignalType, EventID]) AS RawEventSummary,
          SignalType, EventID
        FROM watch_monitoring(artifact="Custom.TFM.HIDS.P1.Critical.Priority.Event_v1/P1_EVENT_PowerShell4104_Basic")
        WHERE EnableP1Critical AND Severity =~ SeverityRegex AND Confidence =~ ConfidenceRegex
          AND NOT (ExcludeRouterSelfEvents AND Evidence =~ RouterSelfEventRegex)
      }, query={ SELECT * FROM chain(jsonl={ SELECT "JSONL_WRITE_ATTEMPT" AS Sink, JsonlPath AS Destination, ReturnCode, Stdout, Stderr, Timestamp, Hostname, ClientId, Artifact, Source, Profile, CU_ID, TEC, MITRE, Severity, Confidence, DetectionName FROM execve(argv=["powershell.exe","-NoProfile","-NonInteractive","-ExecutionPolicy","Bypass","-Command","& { param([string]$p,[string]$b64) $json=[System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($b64)); $compact=($json | ConvertFrom-Json | ConvertTo-Json -Compress -Depth 20); $d=Split-Path -Parent $p; if (!(Test-Path -LiteralPath $d)) { New-Item -ItemType Directory -Path $d -Force | Out-Null }; Add-Content -LiteralPath $p -Value $compact -Encoding UTF8 }",JsonlPath,base64encode(string=serialize(format="json", item=dict(Schema="TFM_SOC_ALERT_v3",Timestamp=Timestamp,DetectionTime=DetectionTime,Hostname=Hostname,ClientId=ClientId,Artifact=Artifact,Source=Source,Profile=Profile,CU_ID=CU_ID,TEC=TEC,MITRE=MITRE,IOA=IOA,IOC=IOC,Severity=Severity,Confidence=Confidence,DetectionName=DetectionName,Evidence=Evidence,RecommendedAction=RecommendedAction,RawEventSummary=RawEventSummary,SignalType=SignalType,EventID=EventID,RouterArtifact="Custom.TFM.HIDS.Router.JSONL.Discord.SOC_v3")))]) WHERE EnableJSONL }, discord={ SELECT "DISCORD_POST_ATTEMPT" AS Sink, ReturnCode, Stdout, Stderr, Timestamp, Hostname, ClientId, Artifact, Source, Profile, CU_ID, TEC, MITRE, Severity, Confidence, DetectionName FROM execve(argv=["powershell.exe","-NoProfile","-NonInteractive","-ExecutionPolicy","Bypass","-Command","& { param([string]$w,[string]$b64,[string]$u,[string]$footer) if ([string]::IsNullOrWhiteSpace($w)) { exit 0 }; $json=[System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($b64)); $a=$json | ConvertFrom-Json; $sev=[string]$a.Severity; $color=5793266; if($sev -match 'Critical'){ $color=10038562 } elseif($sev -match 'High'){ $color=15158332 } elseif($sev -match 'Medium'){ $color=16753920 }; $ioa=[string]$a.IOA; if($ioa.Length -gt 900){ $ioa=$ioa.Substring(0,900)+'...' }; $ioc=[string]$a.IOC; if($ioc.Length -gt 900){ $ioc=$ioc.Substring(0,900)+'...' }; $title='['+$sev+' / '+[string]$a.Confidence+'] '+[string]$a.CU_ID+' '+[string]$a.TEC+' - '+[string]$a.DetectionName; if($title.Length -gt 250){ $title=$title.Substring(0,250) }; $iocValue=$ioc; if([string]::IsNullOrWhiteSpace($iocValue)){ $iocValue='No atomic IOC; behavioral IOA' }; $fields=@(@{name='Timestamp'; value=[string]$a.Timestamp; inline=$true},@{name='Host / Client'; value=([string]$a.Hostname+' / '+[string]$a.ClientId); inline=$true},@{name='CU / TEC'; value=([string]$a.CU_ID+' / '+[string]$a.TEC); inline=$true},@{name='MITRE'; value=[string]$a.MITRE; inline=$true},@{name='Profile'; value=[string]$a.Profile; inline=$true},@{name='Source'; value=([string]$a.Source+' / EventID '+[string]$a.EventID); inline=$true},@{name='Artifact'; value=[string]$a.Artifact; inline=$false},@{name='IOA'; value=$ioa; inline=$false},@{name='IOC'; value=$iocValue; inline=$false},@{name='Action'; value=[string]$a.RecommendedAction; inline=$false}); $embed=[ordered]@{title=$title; description=[string]$a.RawEventSummary; color=$color; fields=$fields; footer=@{text=$footer}; timestamp=(Get-Date).ToUniversalTime().ToString('o')}; $payload=[ordered]@{username=$u; embeds=@($embed)}; $body=$payload | ConvertTo-Json -Depth 12 -Compress; Invoke-RestMethod -Uri $w -Method Post -ContentType 'application/json' -Body $body | Out-Null }",DiscordWebhook,base64encode(string=serialize(format="json", item=dict(Schema="TFM_SOC_ALERT_v3",Timestamp=Timestamp,DetectionTime=DetectionTime,Hostname=Hostname,ClientId=ClientId,Artifact=Artifact,Source=Source,Profile=Profile,CU_ID=CU_ID,TEC=TEC,MITRE=MITRE,IOA=IOA,IOC=IOC,Severity=Severity,Confidence=Confidence,DetectionName=DetectionName,Evidence=Evidence,RecommendedAction=RecommendedAction,RawEventSummary=RawEventSummary,SignalType=SignalType,EventID=EventID,RouterArtifact="Custom.TFM.HIDS.Router.JSONL.Discord.SOC_v3"))),DiscordUsername,DiscordFooter]) WHERE EnableDiscord AND DiscordWebhook =~ '(?i)^https://' }) } )

