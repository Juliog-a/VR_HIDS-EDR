# Version: v11 candidate
# Architecture change:
# - P3 is kept as medium behavioral/context layer.
# - Strong CU-007/CU-008/CU-009 validation is moved to P2_v1.
# - P3 keeps discovery, generic suspicious PowerShell and supporting context only.
# - No lab paths, script names, fixed endpoints, users or hostnames are used as IOC.

name: Custom.TFM.HIDS.P3.Medium.Behavioral_v11
description: |
  Candidate v11 for P3 Medium Behavioral.

  Scope:
  - Medium behavioral and contextual visibility from PowerShell 4104 and Sysmon.
  - CU-001 generic suspicious PowerShell.
  - CU-006 security software discovery.
  - Context for encryption, destruction, archive staging and PowerShell network use.

  Out of scope:
  - Strong ransomware-like validation for CU-007.
  - Strong sabotage/destruction validation for CU-008.
  - Strong staging + ZIP + HTTP upload validation for CU-009.

  Those high-confidence technique-specific detections are moved to
  Custom.TFM.HIDS.P2.High.Forensic_v1.

type: CLIENT_EVENT

parameters:
  - name: HostnameOverride
    default: ""
  - name: ClientIdOverride
    default: ""
  - name: PowerShellLog
    default: C:/Windows/System32/Winevt/Logs/Microsoft-Windows-PowerShell%4Operational.evtx
  - name: SysmonLog
    default: C:/Windows/System32/Winevt/Logs/Microsoft-Windows-Sysmon%4Operational.evtx
  - name: PSNoiseRegex
    default: (?i)(__cmdletization|Export-ModuleMember|MSFT_ScheduledTask|Microsoft\.PowerShell\.Cmdletization|cim:DeleteInstance|\.EXTERNALHELP)
    type: regex
  - name: RouterSelfRegex
    default: (?i)(alerts\.jsonl|Add-Content|RouterArtifact|JSONL_WRITE_ATTEMPT|ConvertFrom-Json|ConvertTo-Json)
    type: regex
  - name: GenericPSRegex
    default: (?i)(-EncodedCommand|FromBase64String|IEX|Invoke-Expression|DownloadString|Invoke-WebRequest|ExecutionPolicy\s+Bypass|NoProfile)
    type: regex
  - name: DiscoveryMethodRegex
    default: '(?i)(root[/\\]SecurityCenter2|SecurityCenter2|AntivirusProduct|AntiSpywareProduct|Get-CimInstance|Get-WmiObject|\bgwmi\b|\bgcim\b|\bwmic(?:\.exe)?\b|Win32_Service)'
    type: regex
  - name: DiscoveryProductRegex
    default: '(?i)(root[/\\]SecurityCenter2|SecurityCenter2|AntivirusProduct|AntiSpywareProduct|Win32_Service|SecurityHealthService|WinDefend|Windows Defender|Defender|EDR|antivirus|anti[- ]?malware|CrowdStrike|SentinelOne|CarbonBlack|Elastic\s*Endpoint|Sophos|McAfee|Symantec|Trend\s*Micro|ESET|Kaspersky)'
    type: regex
  - name: CryptoContextRegex
    default: '(?i)(System\.Security\.Cryptography|AesManaged|AesCng|AES|CryptoStream|CreateEncryptor|CreateDecryptor|Rfc2898DeriveBytes|\.aes)'
    type: regex
  - name: DestructionContextRegex
    default: '(?i)(Remove-Item|\bdel\s+|\berase\s+|\brmdir\s+|Get-ChildItem|ForEach-Object|ForEach|-Recurse|-Force|\$_\.FullName|\$PSItem\.FullName)'
    type: regex
  - name: StagingContextRegex
    default: '(?i)(Compress-Archive|System\.IO\.Compression|ZipFile|\.zip\b|\.7z\b|\.rar\b|Copy-Item|Move-Item|DestinationPath|-Destination|Get-FileHash|SHA256)'
    type: regex
  - name: NetworkContextRegex
    default: '(?i)(Invoke-WebRequest|\biwr\b|\bwget\b|\bcurl\b|https?://|-InFile\b|\bInFile\b|-Method\s+POST|\bPOST\b|application/zip|UserAgent|-UserAgent)'
    type: regex
  - name: SysmonPSHostRegex
    default: '(?i)\\(powershell|pwsh)\.exe$'
    type: regex
  - name: SysmonShellRegex
    default: '(?i)\\(powershell|pwsh|cmd|wmic)\.exe$'
    type: regex
  - name: SysmonDiscoveryCommandRegex
    default: '(?i)((Get-CimInstance|Get-WmiObject|\bgwmi\b|\bgcim\b).*(root[/\\]SecurityCenter2|SecurityCenter2|AntivirusProduct|AntiSpywareProduct|Win32_Service|SecurityHealthService|WinDefend|Windows Defender|Defender|EDR|antivirus|anti[- ]?malware)|(wmic(?:\.exe)?\s+.*(root[/\\]SecurityCenter2|SecurityCenter2|AntivirusProduct|AntiSpywareProduct))|(Win32_Service.*(SecurityHealthService|WinDefend|Defender|EDR|antivirus|anti[- ]?malware)))'
    type: regex
  - name: WebDestinationPortRegex
    default: '^(80|443|8080|8088|8000|8008|8443)$'
    type: regex
  - name: ZipFileRegex
    default: '(?i)\.zip(\s|["'']|$)'
    type: regex

precondition: SELECT OS FROM info() WHERE OS = "windows"

sources:
  - name: CU001_Source_TEC001_PowerShell_Behavioral
    description: |
      CU-001 / T1059.001.
      Generic suspicious PowerShell script block after excluding router/noise.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CU-001" AS CU_ID,
        "TEC-001" AS ID_Tecnica_Interna,
        "T1059.001" AS MITRE_ID,
        "Execution" AS MITRE_Tactic,
        "" AS MITRE_Tactic_Context,
        "PowerShell 4104" AS SignalType,
        "PowerShell suspicious script block - behavioral context v11" AS AlertName,
        "Medium" AS Severity,
        "P3" AS Priority,
        "Medium" AS Confidence,
        "PowerShell Script Block Logging" AS DetectionScope,
        "Detection contextual / Alert RT candidate if routed" AS OutputType,
        "Medio" AS FP_Risk,
        "Generic suspicious PowerShell behavior; high-impact technique validation is handled by P2." AS CU_Reason,
        EventData.ScriptBlockText AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-PowerShell/Operational" AS Channel,
        System.Provider.Name AS Provider,
        "powershell.exe" AS Image,
        EventData.ScriptBlockText AS CommandLine,
        "" AS ParentImage,
        "" AS ParentCommandLine,
        EventData.UserId AS User,
        "" AS Hashes,
        "" AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        "" AS ParentProcessId,
        "" AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        "4104 + generic suspicious PowerShell regex; excludes router self-events and PowerShell module noise" AS DetectionLogic,
        "Does not classify ransomware, sabotage or exfiltration strong behavior; those belong to P2" AS FalsePositiveReduction,
        "B6" AS BenchmarkScenario,
        "P3 Medium Behavioral v11" AS ArtifactProfile
      FROM watch_evtx(filename=PowerShellLog)
      WHERE atoi(string=System.EventID.Value) = 4104
        AND NOT EventData.ScriptBlockText =~ PSNoiseRegex
        AND NOT EventData.ScriptBlockText =~ RouterSelfRegex
        AND EventData.ScriptBlockText =~ GenericPSRegex

  - name: CU006_Source_TEC006_Discovery_Behavioral
    description: |
      CU-006 / T1518.001.
      Security software discovery via PowerShell 4104.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CU-006" AS CU_ID,
        "TEC-006" AS ID_Tecnica_Interna,
        "T1518.001" AS MITRE_ID,
        "Discovery" AS MITRE_Tactic,
        "" AS MITRE_Tactic_Context,
        "PowerShell 4104" AS SignalType,
        "Security software discovery detected - behavioral context v11" AS AlertName,
        "Medium" AS Severity,
        "P3" AS Priority,
        "Medium" AS Confidence,
        "PowerShell Script Block Logging" AS DetectionScope,
        "Detection contextual / Alert RT candidate if routed" AS OutputType,
        "Medio" AS FP_Risk,
        "SecurityCenter2/AntivirusProduct or AV/EDR discovery query" AS CU_Reason,
        EventData.ScriptBlockText AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-PowerShell/Operational" AS Channel,
        System.Provider.Name AS Provider,
        "powershell.exe" AS Image,
        EventData.ScriptBlockText AS CommandLine,
        "" AS ParentImage,
        "" AS ParentCommandLine,
        EventData.UserId AS User,
        "" AS Hashes,
        "" AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        "" AS ParentProcessId,
        "" AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        "4104 + discovery method + security software target" AS DetectionLogic,
        "Legitimate administration possible; keep as contextual unless combined elsewhere" AS FalsePositiveReduction,
        "B6" AS BenchmarkScenario,
        "P3 Medium Behavioral v11" AS ArtifactProfile
      FROM watch_evtx(filename=PowerShellLog)
      WHERE atoi(string=System.EventID.Value) = 4104
        AND NOT EventData.ScriptBlockText =~ RouterSelfRegex
        AND EventData.ScriptBlockText =~ DiscoveryMethodRegex
        AND EventData.ScriptBlockText =~ DiscoveryProductRegex

  - name: CU006_Source_TEC006_Discovery_Behavioral_Sysmon
    description: |
      CU-006 / T1518.001.
      Security software discovery from Sysmon process creation telemetry.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CU-006" AS CU_ID,
        "TEC-006" AS ID_Tecnica_Interna,
        "T1518.001" AS MITRE_ID,
        "Discovery" AS MITRE_Tactic,
        "" AS MITRE_Tactic_Context,
        "Sysmon Process Create" AS SignalType,
        "Security software discovery detected - Sysmon context v11" AS AlertName,
        "Medium" AS Severity,
        "P3" AS Priority,
        "Medium" AS Confidence,
        "Sysmon ID 1 process command line" AS DetectionScope,
        "Detection contextual / Alert RT candidate if routed" AS OutputType,
        "Medio" AS FP_Risk,
        "Security software discovery via WMI/CIM/WMIC command line" AS CU_Reason,
        EventData.CommandLine AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-Sysmon/Operational" AS Channel,
        System.Provider.Name AS Provider,
        EventData.Image AS Image,
        EventData.CommandLine AS CommandLine,
        EventData.ParentImage AS ParentImage,
        EventData.ParentCommandLine AS ParentCommandLine,
        EventData.User AS User,
        EventData.Hashes AS Hashes,
        EventData.ProcessGuid AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        EventData.ParentProcessId AS ParentProcessId,
        "" AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        "Sysmon ID 1 + shell image + discovery method and product/service context" AS DetectionLogic,
        "Requires discovery method and defensive product/service context" AS FalsePositiveReduction,
        "B6" AS BenchmarkScenario,
        "P3 Medium Behavioral v11" AS ArtifactProfile
      FROM watch_evtx(filename=SysmonLog)
      WHERE atoi(string=System.EventID.Value) = 1
        AND EventData.Image =~ SysmonShellRegex
        AND EventData.CommandLine =~ SysmonDiscoveryCommandRegex
        AND NOT EventData.CommandLine =~ RouterSelfRegex

  - name: Context_Source_Crypto_FileImpact_4104
    description: |
      Context for encryption/file-impact activity. Not a CU-007 strong validation.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CTX-IMPACT-CRYPTO" AS CU_ID,
        "" AS ID_Tecnica_Interna,
        "T1486 context" AS MITRE_ID,
        "Impact" AS MITRE_Tactic,
        "Context only; strong CU-007 detection is handled by P2." AS MITRE_Tactic_Context,
        "PowerShell 4104" AS SignalType,
        "Encryption or file-impact PowerShell context" AS AlertName,
        "Medium" AS Severity,
        "P3" AS Priority,
        "Medium" AS Confidence,
        "PowerShell Script Block Logging" AS DetectionScope,
        "Context / Supporting Evidence" AS OutputType,
        "Medio" AS FP_Risk,
        "PowerShell contains crypto or encrypted-extension terms; not classified as ransomware-like by P3." AS CU_Reason,
        EventData.ScriptBlockText AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-PowerShell/Operational" AS Channel,
        System.Provider.Name AS Provider,
        "powershell.exe" AS Image,
        EventData.ScriptBlockText AS CommandLine,
        "" AS ParentImage,
        "" AS ParentCommandLine,
        EventData.UserId AS User,
        "" AS Hashes,
        "" AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        "" AS ParentProcessId,
        "" AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        "4104 + crypto/file-impact context regex only" AS DetectionLogic,
        "P3 does not emit CU-007 high-confidence alert; avoids architecture overlap with P2" AS FalsePositiveReduction,
        "B6" AS BenchmarkScenario,
        "P3 Medium Behavioral v11" AS ArtifactProfile
      FROM watch_evtx(filename=PowerShellLog)
      WHERE atoi(string=System.EventID.Value) = 4104
        AND NOT EventData.ScriptBlockText =~ PSNoiseRegex
        AND NOT EventData.ScriptBlockText =~ RouterSelfRegex
        AND EventData.ScriptBlockText =~ CryptoContextRegex

  - name: Context_Source_Destruction_4104
    description: |
      Context for destructive PowerShell activity. Not a CU-008 strong validation.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CTX-IMPACT-DESTRUCTION" AS CU_ID,
        "" AS ID_Tecnica_Interna,
        "T1485 context" AS MITRE_ID,
        "Impact" AS MITRE_Tactic,
        "Context only; strong CU-008 detection is handled by P2." AS MITRE_Tactic_Context,
        "PowerShell 4104" AS SignalType,
        "Destructive PowerShell context" AS AlertName,
        "Medium" AS Severity,
        "P3" AS Priority,
        "Medium" AS Confidence,
        "PowerShell Script Block Logging" AS DetectionScope,
        "Context / Supporting Evidence" AS OutputType,
        "Medio" AS FP_Risk,
        "PowerShell contains deletion or recursive file-operation terms; not classified as sabotage by P3." AS CU_Reason,
        EventData.ScriptBlockText AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-PowerShell/Operational" AS Channel,
        System.Provider.Name AS Provider,
        "powershell.exe" AS Image,
        EventData.ScriptBlockText AS CommandLine,
        "" AS ParentImage,
        "" AS ParentCommandLine,
        EventData.UserId AS User,
        "" AS Hashes,
        "" AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        "" AS ParentProcessId,
        "" AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        "4104 + destructive context regex only" AS DetectionLogic,
        "Sysmon ID 26 remains forensic evidence, not an individual P3 alert" AS FalsePositiveReduction,
        "B6" AS BenchmarkScenario,
        "P3 Medium Behavioral v11" AS ArtifactProfile
      FROM watch_evtx(filename=PowerShellLog)
      WHERE atoi(string=System.EventID.Value) = 4104
        AND NOT EventData.ScriptBlockText =~ PSNoiseRegex
        AND NOT EventData.ScriptBlockText =~ RouterSelfRegex
        AND EventData.ScriptBlockText =~ DestructionContextRegex

  - name: Context_Source_Archive_Staging_4104
    description: |
      Context for archive/staging activity. Not a CU-009 strong validation.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CTX-STAGING-ARCHIVE" AS CU_ID,
        "" AS ID_Tecnica_Interna,
        "T1074.001 / T1560.001 context" AS MITRE_ID,
        "Collection" AS MITRE_Tactic,
        "Context only; strong CU-009 staging + upload detection is handled by P2." AS MITRE_Tactic_Context,
        "PowerShell 4104" AS SignalType,
        "Archive staging PowerShell context" AS AlertName,
        "Medium" AS Severity,
        "P3" AS Priority,
        "Medium" AS Confidence,
        "PowerShell Script Block Logging" AS DetectionScope,
        "Context / Supporting Evidence" AS OutputType,
        "Medio" AS FP_Risk,
        "PowerShell contains archive/staging terms; no HTTP exfiltration claim is made by P3." AS CU_Reason,
        EventData.ScriptBlockText AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-PowerShell/Operational" AS Channel,
        System.Provider.Name AS Provider,
        "powershell.exe" AS Image,
        EventData.ScriptBlockText AS CommandLine,
        "" AS ParentImage,
        "" AS ParentCommandLine,
        EventData.UserId AS User,
        "" AS Hashes,
        "" AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        "" AS ParentProcessId,
        "" AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        "4104 + archive/staging context regex only" AS DetectionLogic,
        "Does not require or claim transfer; avoids P3/P2 overlap" AS FalsePositiveReduction,
        "B6" AS BenchmarkScenario,
        "P3 Medium Behavioral v11" AS ArtifactProfile
      FROM watch_evtx(filename=PowerShellLog)
      WHERE atoi(string=System.EventID.Value) = 4104
        AND NOT EventData.ScriptBlockText =~ PSNoiseRegex
        AND NOT EventData.ScriptBlockText =~ RouterSelfRegex
        AND EventData.ScriptBlockText =~ StagingContextRegex

  - name: Context_Source_PowerShell_HTTP_Network_Sysmon
    description: |
      Context for PowerShell HTTP-like network activity. Not a CU-009 strong validation.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CTX-NETWORK-POWERSHELL" AS CU_ID,
        "" AS ID_Tecnica_Interna,
        "Network context" AS MITRE_ID,
        "Command and Control / Exfiltration context" AS MITRE_Tactic,
        "Network-only context; no transfer or exfiltration claim is made by P3." AS MITRE_Tactic_Context,
        "Sysmon Network Connection" AS SignalType,
        "PowerShell HTTP-like network context" AS AlertName,
        "Medium" AS Severity,
        "P3" AS Priority,
        "Medium" AS Confidence,
        "Sysmon ID 3 network connection" AS DetectionScope,
        "Context / Supporting Evidence" AS OutputType,
        "Medio/Alto" AS FP_Risk,
        "PowerShell initiated HTTP-like connection; strong CU-009 chain belongs to P2." AS CU_Reason,
        EventData.DestinationIp AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-Sysmon/Operational" AS Channel,
        System.Provider.Name AS Provider,
        EventData.Image AS Image,
        "" AS CommandLine,
        "" AS ParentImage,
        "" AS ParentCommandLine,
        EventData.User AS User,
        "" AS Hashes,
        EventData.ProcessGuid AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        "" AS ParentProcessId,
        "" AS TargetFilename,
        EventData.DestinationIp AS DestinationIp,
        EventData.DestinationPort AS DestinationPort,
        EventData.DestinationHostname AS DestinationHostname,
        "Sysmon ID 3 + PowerShell image + initiated connection to HTTP-like port" AS DetectionLogic,
        "Network alone is context and does not prove ZIP transfer" AS FalsePositiveReduction,
        "B6" AS BenchmarkScenario,
        "P3 Medium Behavioral v11" AS ArtifactProfile
      FROM watch_evtx(filename=SysmonLog)
      WHERE atoi(string=System.EventID.Value) = 3
        AND EventData.Image =~ SysmonPSHostRegex
        AND EventData.Initiated =~ "(?i)true"
        AND EventData.DestinationPort =~ WebDestinationPortRegex
