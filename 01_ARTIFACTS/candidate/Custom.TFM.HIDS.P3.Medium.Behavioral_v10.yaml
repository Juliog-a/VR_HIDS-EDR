# Version: v10 candidate
# Changes:
# - Keeps P3_v3 PowerShell 4104 detections.
# - Keeps CU-006/CU-008 Sysmon and CU-007 4104 behavior from v4.
# - Refines CU-009 strong detection for controlled HTTP upload of dummy ZIP data.
# - Splits local archive staging from controlled HTTP exfiltration.
# - Keeps CU-009 DNS, network and ZIP Sysmon sources as supporting context only.
# - Splits encryption/ransomware-like crypto from hash/integrity evidence.
# - Integrates experimentally validated CU009Shape_v4 logic in CU-009 4104.
# - Uses direct watch_evtx filtering for CU-009 strong live detection.
# - Does not use lab paths, script names or technique labels as IOC.

name: Custom.TFM.HIDS.P3.Medium.Behavioral_v10
description: |
  Candidate v10 for P3 Medium Behavioral.

  Scope:
  - Behavioral detections from PowerShell 4104 and Sysmon process telemetry.
  - Separates discovery, encryption, destruction and staging.
  - Maintains methodological distinction between detection, forensic evidence,
    real-time alerting and external output.

  Semantic priority:
  1. CU-007 crypto/encryption impact.
  2. CU-009 staging/archive/network contextual.
  3. CU-008 destructive deletion.
  4. CU-006 security software discovery.
  5. CU-001 generic suspicious PowerShell.

type: CLIENT_EVENT

parameters:
  - name: HostnameOverride
    default: LT29.ait.us.es
  - name: ClientIdOverride
    default: C.364907172793f8c7
  - name: PowerShellLog
    default: C:/Windows/System32/Winevt/Logs/Microsoft-Windows-PowerShell%4Operational.evtx
  - name: SysmonLog
    default: C:/Windows/System32/Winevt/Logs/Microsoft-Windows-Sysmon%4Operational.evtx
  - name: PSNoiseRegex
    default: (?i)(__cmdletization|Export-ModuleMember|MSFT_ScheduledTask|Microsoft\.PowerShell\.Cmdletization|cim:DeleteInstance|\.EXTERNALHELP)
    type: regex
  - name: GenericPSRegex
    default: (?i)(-EncodedCommand|FromBase64String|IEX|Invoke-Expression|DownloadString|Invoke-WebRequest|ExecutionPolicy\s+Bypass|NoProfile)
    type: regex
  - name: RouterSelfRegex
    default: (?i)(alerts\.jsonl|Add-Content|RouterArtifact|JSONL_WRITE_ATTEMPT|ConvertFrom-Json|ConvertTo-Json)
    type: regex
  - name: DiscoveryRegex
    default: '(?i)(root[/\\]SecurityCenter2|SecurityCenter2|AntivirusProduct|AntiSpywareProduct|Get-CimInstance|Get-WmiObject|\bgwmi\b|\bgcim\b|\bwmic(?:\.exe)?\b|Win32_Service|SecurityHealthService|WinDefend|Windows Defender|Defender|EDR|antivirus|anti[- ]?malware|CrowdStrike|SentinelOne|CarbonBlack|Elastic\s*Endpoint|Sophos|McAfee|Symantec|Trend\s*Micro|ESET|Kaspersky)'
    type: regex
  - name: DiscoveryMethodRegex
    default: '(?i)(root[/\\]SecurityCenter2|SecurityCenter2|AntivirusProduct|AntiSpywareProduct|Get-CimInstance|Get-WmiObject|\bgwmi\b|\bgcim\b|\bwmic(?:\.exe)?\b|Win32_Service)'
    type: regex
  - name: DiscoveryProductRegex
    default: '(?i)(root[/\\]SecurityCenter2|SecurityCenter2|AntivirusProduct|AntiSpywareProduct|Win32_Service|SecurityHealthService|WinDefend|Windows Defender|Defender|EDR|antivirus|anti[- ]?malware|CrowdStrike|SentinelOne|CarbonBlack|Elastic\s*Endpoint|Sophos|McAfee|Symantec|Trend\s*Micro|ESET|Kaspersky)'
    type: regex
  - name: CryptoEncryptionRegex
    default: (?i)(System\.Security\.Cryptography|AesManaged|AesCng|AES|CryptoStream|CreateEncryptor|CreateDecryptor|Rfc2898DeriveBytes|\.aes)
    type: regex
  - name: HashEvidenceRegex
    default: (?i)(Get-FileHash|SHA256|SHA1|MD5|LocalSHA256|FileHash)
    type: regex
  - name: DestructionCoreRegex
    default: '(?i)(Remove-Item|Remove-Item\s+|Microsoft\.PowerShell\.Management\\Remove-Item|\bdel\s+|\berase\s+|\brmdir\s+)'
    type: regex
  - name: DestructionContextRegex
    default: '(?i)(Get-ChildItem|ForEach-Object|ForEach|-Recurse|-Force|-LiteralPath|-Path|\$_\.FullName|\$PSItem\.FullName)'
    type: regex
  - name: DestructionStrongRegex
    default: '(?is)((Get-ChildItem|gci|dir|ls).*(Remove-Item|del\s+|erase\s+|rmdir\s+)|(Remove-Item|del\s+|erase\s+|rmdir\s+).*(-Force|-Recurse|\$_\.FullName|\$PSItem\.FullName))'
    type: regex
  - name: StagingArchiveRegex
    default: '(?i)(Compress-Archive|System\.IO\.Compression|ZipFile|\.zip\b|\.7z\b|\.rar\b)'
    type: regex
  - name: StagingCopyRegex
    default: '(?i)(Copy-Item|Move-Item|DestinationPath|-Destination|\bcopy\s+|\bmove\s+)'
    type: regex
  - name: StagingStrongRegex
    default: '(?is)(Compress-Archive.*(Copy-Item|Move-Item|DestinationPath|-Destination|Get-FileHash|Invoke-WebRequest|\biwr\b|\.zip\b)|(Copy-Item|Move-Item).*(\.zip\b|\.7z\b|\.rar\b|Compress-Archive)|Get-FileHash.*(\.zip\b|Invoke-WebRequest|\biwr\b))'
    type: regex
  - name: NetworkContextRegex
    default: '(?i)(TcpClient|System\.Net\.Sockets|\.Connect\(|Connect\(|Invoke-WebRequest|\biwr\b|\bwget\b|\bcurl\b|bitsadmin|rclone|scp|ftp|https?://)'
    type: regex
  - name: UploadHttpRegex
    default: '(?i)(Invoke-WebRequest|\biwr\b|\bwget\b|\bcurl\b)'
    type: regex
  - name: UploadFileRegex
    default: '(?i)(-InFile\b|\bInFile\b)'
    type: regex
  - name: UploadPostRegex
    default: '(?i)(-Method\s+POST|\bMethod\s+POST\b|\bPOST\b)'
    type: regex
  - name: UploadZipContentRegex
    default: '(?i)(-ContentType\s+["'']?application/zip|application/zip)'
    type: regex
  - name: UploadUriRegex
    default: '(?i)(-Uri\b|\bUri\b|https?://)'
    type: regex
  - name: DetectionEngineeringNoiseRegex
    default: '(?i)(Get-WinEvent|Where-Object|Select-Object|Format-List|\$_\.Message\s+-match|UploadHttpRegex|UploadFileRegex|UploadPostRegex|UploadZipContentRegex|HashEvidenceRegex|CryptoEncryptionRegex|CU009StrongCandidate|ActualInvokeWebRequestShape|ActualUploadCommandShape|ScriptBlockText|Custom\.TFM\.Debug|PowerShell4104_|regex)'
    type: regex
  - name: DocumentationNoiseRegex
    default: '(?i)(^\s*[\*\-]\s*(Invoke-WebRequest\s*/\s*iwr|wget|curl)|debe\s+contener|requisitos|objetivo|texto\s+de\s+prompt|prompt|documentaci.n|listado?\s+tipo|candidate\s+(artifact|debug|yaml))'
    type: regex
  - name: UploadContextRegex
    default: '(?i)(https?://|UserAgent|-UserAgent)'
    type: regex
  - name: HttpUrlRegex
    default: '(?i)https?://'
    type: regex

  - name: SysmonPSHostRegex
    default: '(?i)\\(powershell|pwsh)\.exe$'
    type: regex
  - name: SysmonShellRegex
    default: '(?i)\\(powershell|pwsh|cmd|wmic)\.exe$'
    type: regex
  - name: SysmonDiscoveryCommandRegex
    default: '(?i)((Get-CimInstance|Get-WmiObject|\bgwmi\b|\bgcim\b).*(root[/\\]SecurityCenter2|SecurityCenter2|AntivirusProduct|AntiSpywareProduct|Win32_Service|SecurityHealthService|WinDefend|Windows Defender|Defender|EDR|antivirus|anti[- ]?malware)|(wmic(?:\.exe)?\s+.*(root[/\\]SecurityCenter2|SecurityCenter2|AntivirusProduct|AntiSpywareProduct))|(Win32_Service.*(SecurityHealthService|WinDefend|Defender|EDR|antivirus|anti[- ]?malware)))'
    type: regex
  - name: SysmonDestructionCommandRegex
    default: '(?is)((Get-ChildItem|gci|dir|ls).*(Remove-Item|del\s+|erase\s+|rmdir\s+).*(-Force|-Recurse|\$_\.FullName|\$PSItem\.FullName)|(Remove-Item|del\s+|erase\s+|rmdir\s+).*(-Force|-Recurse).*(Get-ChildItem|gci|dir|ls|\$_\.FullName|\$PSItem\.FullName))'
    type: regex
  - name: SysmonStagingCommandRegex
    default: '(?is)((Compress-Archive|System\.IO\.Compression|ZipFile|\.zip\b).*(Copy-Item|Move-Item|-Destination|DestinationPath|Get-FileHash|Invoke-WebRequest|\biwr\b|-InFile|application/zip))|((Copy-Item|Move-Item).*(Compress-Archive|\.zip\b|\.7z\b|\.rar\b|-Destination|DestinationPath))|((Invoke-WebRequest|\biwr\b).*(-InFile|\bInFile\b|application/zip|\bPOST\b|https?://))'
    type: regex
  - name: ExternalDnsRegex
    default: '(?i)^[A-Za-z0-9][A-Za-z0-9.-]*\.[A-Za-z]{2,}$'
    type: regex
  - name: LocalDnsRegex
    default: '(?i)(^localhost$|(^|\.)(local|lan|internal|home|corp)$)'
    type: regex
  - name: ExternalDestinationDenyRegex
    default: '(?i)^(127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[0-1])\.|169\.254\.|0\.|255\.|::1$|fe80:|fc[0-9a-f]|fd[0-9a-f])'
    type: regex
  - name: WebDestinationPortRegex
    default: '^(80|443|8080|8088|8000|8008|8443)$'
    type: regex
  - name: ZipFileRegex
    default: '(?i)\.zip(\s|["'']|$)'
    type: regex
precondition: SELECT OS FROM info() WHERE OS = "windows"

sources:
  - name: CU001_Source_TEC001_PowerShell_Behavioral
    description: |
      CU-001 / T1059.001.
      Generic suspicious PowerShell script block, after more specific CU have priority.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CU-001" AS CU_ID,
        "TEC-001" AS ID_Tecnica_Interna,
        "T1059.001" AS MITRE_ID,
        "Execution" AS MITRE_Tactic,
        "" AS MITRE_Tactic_Context,
        "PowerShell 4104" AS SignalType,
        "PowerShell suspicious script block - behavioral profile v10" AS AlertName,
        "Medium" AS Severity,
        "P3" AS Priority,
        "Medium" AS Confidence,
        "PowerShell Script Block Logging" AS DetectionScope,
        "Deteccion / Alerta RT si se enruta" AS OutputType,
        "Medio" AS FP_Risk,
        "Generic suspicious PowerShell after excluding higher-specificity behavior" AS CU_Reason,
        EventData.ScriptBlockText AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-PowerShell/Operational" AS Channel,
        System.Provider.Name AS Provider,
        "powershell.exe" AS Image,
        EventData.ScriptBlockText AS CommandLine,
        "" AS ParentImage,
        "" AS ParentCommandLine,
        EventData.UserId AS User,
        "" AS Hashes,
        "" AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        "" AS ParentProcessId,
        "" AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        "4104 + generic suspicious PowerShell; excludes noise, router self-events and higher-specificity CU behavior" AS DetectionLogic,
        "Does not globally exclude ForEach-Object, Where-Object or Select-Object; excludes router JSONL self-events" AS FalsePositiveReduction,
        "B6" AS BenchmarkScenario,
        "P3 Medium Behavioral v10" AS ArtifactProfile
      FROM watch_evtx(filename=PowerShellLog)
      WHERE atoi(string=System.EventID.Value) = 4104
        AND NOT EventData.ScriptBlockText =~ PSNoiseRegex
        AND NOT EventData.ScriptBlockText =~ RouterSelfRegex
        AND EventData.ScriptBlockText =~ GenericPSRegex
        AND NOT EventData.ScriptBlockText =~ CryptoEncryptionRegex
        AND NOT (
          EventData.ScriptBlockText =~ DiscoveryMethodRegex
          AND EventData.ScriptBlockText =~ DiscoveryProductRegex
        )
        AND NOT (
          EventData.ScriptBlockText =~ StagingArchiveRegex
          AND (
            EventData.ScriptBlockText =~ StagingCopyRegex
            OR EventData.ScriptBlockText =~ NetworkContextRegex
          )
        )
        AND NOT (
          EventData.ScriptBlockText =~ UploadHttpRegex
          AND EventData.ScriptBlockText =~ UploadFileRegex
          AND EventData.ScriptBlockText =~ UploadPostRegex
        )
        AND NOT (
          EventData.ScriptBlockText =~ DestructionStrongRegex
          OR (
            EventData.ScriptBlockText =~ DestructionCoreRegex
            AND EventData.ScriptBlockText =~ DestructionContextRegex
          )
        )

  - name: CU006_Source_TEC006_Discovery_Behavioral
    description: |
      CU-006 / T1518.001.
      Security Software Discovery via PowerShell 4104.
      Contextual detection, not critical if isolated.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CU-006" AS CU_ID,
        "TEC-006" AS ID_Tecnica_Interna,
        "T1518.001" AS MITRE_ID,
        "Discovery" AS MITRE_Tactic,
        "" AS MITRE_Tactic_Context,
        "PowerShell 4104" AS SignalType,
        "Security software discovery detected - behavioral profile v10" AS AlertName,
        "Medium" AS Severity,
        "P3" AS Priority,
        "Medium" AS Confidence,
        "PowerShell Script Block Logging" AS DetectionScope,
        "Deteccion contextual / Alerta si se enruta" AS OutputType,
        "Medio" AS FP_Risk,
        "SecurityCenter2/AntivirusProduct or AV/EDR discovery query" AS CU_Reason,
        EventData.ScriptBlockText AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-PowerShell/Operational" AS Channel,
        System.Provider.Name AS Provider,
        "powershell.exe" AS Image,
        EventData.ScriptBlockText AS CommandLine,
        "" AS ParentImage,
        "" AS ParentCommandLine,
        EventData.UserId AS User,
        "" AS Hashes,
        "" AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        "" AS ParentProcessId,
        "" AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        "4104 + SecurityCenter2/AntivirusProduct/Get-CimInstance/Get-WmiObject/wmic-like discovery" AS DetectionLogic,
        "Legitimate administration possible; keep as contextual unless combined with stronger behavior" AS FalsePositiveReduction,
        "B6" AS BenchmarkScenario,
        "P3 Medium Behavioral v10" AS ArtifactProfile
      FROM watch_evtx(filename=PowerShellLog)
      WHERE atoi(string=System.EventID.Value) = 4104
        AND NOT EventData.ScriptBlockText =~ RouterSelfRegex
        AND EventData.ScriptBlockText =~ DiscoveryMethodRegex
        AND EventData.ScriptBlockText =~ DiscoveryProductRegex
        AND NOT EventData.ScriptBlockText =~ CryptoEncryptionRegex
        AND NOT (
          EventData.ScriptBlockText =~ StagingArchiveRegex
          AND (
            EventData.ScriptBlockText =~ StagingCopyRegex
            OR EventData.ScriptBlockText =~ NetworkContextRegex
          )
        )
        AND NOT (
          EventData.ScriptBlockText =~ DestructionCoreRegex
          AND EventData.ScriptBlockText =~ DestructionContextRegex
        )

  - name: CU007_Source_TEC007_Ransomware_Behavioral
    description: |
      CU-007 / T1486.
      Controlled ransomware-like encryption behavior.
      Requires strong encryption/AES/CryptoStream/.aes evidence.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CU-007" AS CU_ID,
        "TEC-007" AS ID_Tecnica_Interna,
        "T1486" AS MITRE_ID,
        "Impact" AS MITRE_Tactic,
        "" AS MITRE_Tactic_Context,
        "PowerShell 4104" AS SignalType,
        "Possible ransomware-like encryption behavior - behavioral profile v10" AS AlertName,
        "Critical" AS Severity,
        "P1" AS Priority,
        "High" AS Confidence,
        "PowerShell Script Block Logging" AS DetectionScope,
        "Alerta RT / Discord recomendado solo tras validar JSONL" AS OutputType,
        "Bajo/Medio" AS FP_Risk,
        "Strong PowerShell encryption indicators" AS CU_Reason,
        EventData.ScriptBlockText AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-PowerShell/Operational" AS Channel,
        System.Provider.Name AS Provider,
        "powershell.exe" AS Image,
        EventData.ScriptBlockText AS CommandLine,
        "" AS ParentImage,
        "" AS ParentCommandLine,
        EventData.UserId AS User,
        "" AS Hashes,
        "" AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        "" AS ParentProcessId,
        "" AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        "4104 + strong encryption regex; priority over CU-008/CU-009 when encryption is present" AS DetectionLogic,
        "May match legitimate encryption tools; no script-name or lab-path dependency" AS FalsePositiveReduction,
        "B6" AS BenchmarkScenario,
        "P3 Medium Behavioral v10" AS ArtifactProfile
      FROM watch_evtx(filename=PowerShellLog)
      WHERE atoi(string=System.EventID.Value) = 4104
        AND NOT EventData.ScriptBlockText =~ PSNoiseRegex
        AND EventData.ScriptBlockText =~ CryptoEncryptionRegex

  - name: CU008_Source_TEC008_Destruction_Behavioral
    description: |
      CU-008 / T1485.
      Destructive deletion behavior. Sysmon ID 26 remains forensic evidence,
      not an individual operational alert.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CU-008" AS CU_ID,
        "TEC-008" AS ID_Tecnica_Interna,
        "T1485" AS MITRE_ID,
        "Impact" AS MITRE_Tactic,
        "" AS MITRE_Tactic_Context,
        "PowerShell 4104" AS SignalType,
        "Possible destructive deletion behavior - behavioral profile v10" AS AlertName,
        "Critical" AS Severity,
        "P1" AS Priority,
        "High" AS Confidence,
        "PowerShell Script Block Logging" AS DetectionScope,
        "Alerta RT / Discord recomendado solo tras validar JSONL" AS OutputType,
        "Medio" AS FP_Risk,
        "Remove-Item with force/recursive or pipeline deletion context" AS CU_Reason,
        EventData.ScriptBlockText AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-PowerShell/Operational" AS Channel,
        System.Provider.Name AS Provider,
        "powershell.exe" AS Image,
        EventData.ScriptBlockText AS CommandLine,
        "" AS ParentImage,
        "" AS ParentCommandLine,
        EventData.UserId AS User,
        "" AS Hashes,
        "" AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        "" AS ParentProcessId,
        "" AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        "4104 + destructive core + destructive context; excludes crypto and staging/archive blocks" AS DetectionLogic,
        "Does not alert on Sysmon ID 26 individual events; does not globally remove ForEach-Object/Where-Object/Select-Object" AS FalsePositiveReduction,
        "B6" AS BenchmarkScenario,
        "P3 Medium Behavioral v10" AS ArtifactProfile
      FROM watch_evtx(filename=PowerShellLog)
      WHERE atoi(string=System.EventID.Value) = 4104
        AND NOT EventData.ScriptBlockText =~ PSNoiseRegex
        AND NOT EventData.ScriptBlockText =~ RouterSelfRegex
        AND (
          EventData.ScriptBlockText =~ DestructionStrongRegex
          OR (
            EventData.ScriptBlockText =~ DestructionCoreRegex
            AND EventData.ScriptBlockText =~ DestructionContextRegex
          )
        )
        AND NOT EventData.ScriptBlockText =~ CryptoEncryptionRegex
        AND NOT (
          EventData.ScriptBlockText =~ StagingArchiveRegex
          AND (
            EventData.ScriptBlockText =~ StagingCopyRegex
            OR EventData.ScriptBlockText =~ NetworkContextRegex
          )
        )

  - name: CU009_Source_TEC009_HTTP_Upload_Strong_4104
    description: |
      CU-009 / T1074.001 + T1560.001 + T1048.003.
      Strong detection for controlled HTTP POST upload of dummy ZIP data.
      Requires validated command shape: HTTP tool, URI/destination, POST,
      InFile and ZIP content evidence in the same live ScriptBlockText.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CU-009" AS CU_ID,
        "TEC-009" AS ID_Tecnica_Interna,
        "T1074.001 / T1560.001 / T1048.003" AS MITRE_ID,
        "Collection / Exfiltration" AS MITRE_Tactic,
        "Controlled HTTP exfiltration of dummy ZIP data in lab; no sensitive real data involved." AS MITRE_Tactic_Context,
        "PowerShell 4104" AS SignalType,
        "Controlled HTTP Exfiltration of Dummy ZIP Data" AS AlertName,
        "High" AS Severity,
        "P3" AS Priority,
        "High" AS Confidence,
        "PowerShell Script Block Logging" AS DetectionScope,
        "Detection / Alert RT candidate" AS OutputType,
        "Medio" AS FP_Risk,
        "PowerShell script block shows validated HTTP upload command shape: tool, URI/destination, POST, InFile and ZIP content evidence." AS CU_Reason,
        EventData.ScriptBlockText AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-PowerShell/Operational" AS Channel,
        System.Provider.Name AS Provider,
        "powershell.exe" AS Image,
        EventData.ScriptBlockText AS CommandLine,
        EventData.ScriptBlockText AS ScriptText,
        "" AS ParentImage,
        "" AS ParentCommandLine,
        EventData.UserId AS User,
        "" AS Hashes,
        "" AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        "" AS ParentProcessId,
        "" AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        EventData.ScriptBlockText =~ UploadHttpRegex AS UploadHttpRegex,
        EventData.ScriptBlockText =~ UploadUriRegex AS UploadUriRegex,
        EventData.ScriptBlockText =~ UploadPostRegex AS UploadPostRegex,
        EventData.ScriptBlockText =~ UploadFileRegex AS UploadFileRegex,
        EventData.ScriptBlockText =~ UploadZipContentRegex AS UploadZipContentRegex,
        EventData.ScriptBlockText =~ HashEvidenceRegex AS HashEvidenceRegex,
        EventData.ScriptBlockText =~ CryptoEncryptionRegex AS CryptoEncryptionRegex,
        EventData.ScriptBlockText =~ DetectionEngineeringNoiseRegex AS DetectionEngineeringNoiseRegex,
        EventData.ScriptBlockText =~ DocumentationNoiseRegex AS DocumentationNoiseRegex,
        (
          EventData.ScriptBlockText =~ UploadHttpRegex
          AND EventData.ScriptBlockText =~ UploadUriRegex
        ) AS ActualInvokeWebRequestShape,
        (
          EventData.ScriptBlockText =~ UploadHttpRegex
          AND EventData.ScriptBlockText =~ UploadUriRegex
          AND EventData.ScriptBlockText =~ UploadPostRegex
          AND EventData.ScriptBlockText =~ UploadFileRegex
          AND EventData.ScriptBlockText =~ UploadZipContentRegex
        ) AS ActualUploadCommandShape,
        EventData.ScriptBlockText =~ DestructionStrongRegex AS DestructionStrongRegex,
        (
          EventData.ScriptBlockText =~ '(?s).'
          AND EventData.ScriptBlockText =~ UploadHttpRegex
          AND EventData.ScriptBlockText =~ UploadUriRegex
          AND EventData.ScriptBlockText =~ UploadPostRegex
          AND EventData.ScriptBlockText =~ UploadFileRegex
          AND EventData.ScriptBlockText =~ UploadZipContentRegex
          AND NOT EventData.ScriptBlockText =~ CryptoEncryptionRegex
          AND NOT EventData.ScriptBlockText =~ DetectionEngineeringNoiseRegex
          AND NOT EventData.ScriptBlockText =~ DocumentationNoiseRegex
        ) AS CU009StrongCandidate,
        "4104 strong CU-009 v10: live watch_evtx direct over ScriptBlockText contains HTTP tool + URI/destination + POST + InFile + application/zip; hash evidence is allowed; encryption is excluded" AS DetectionLogic,
        "Excludes router self-events, PowerShell noise, detection-engineering/documentation noise and encryption blocks; no lab path, script name, fixed endpoint or technique-label dependency; local cleanup Remove-Item does not block confirmed upload" AS FalsePositiveReduction,
        "B6" AS BenchmarkScenario,
        "P3 Medium Behavioral v10" AS ArtifactProfile
      FROM watch_evtx(filename=PowerShellLog)
      WHERE atoi(string=System.EventID.Value) = 4104
        AND EventData.ScriptBlockText =~ '(?s).'
        AND NOT EventData.ScriptBlockText =~ PSNoiseRegex
        AND NOT EventData.ScriptBlockText =~ RouterSelfRegex
        AND EventData.ScriptBlockText =~ UploadHttpRegex
        AND EventData.ScriptBlockText =~ UploadUriRegex
        AND EventData.ScriptBlockText =~ UploadPostRegex
        AND EventData.ScriptBlockText =~ UploadFileRegex
        AND EventData.ScriptBlockText =~ UploadZipContentRegex
        AND NOT EventData.ScriptBlockText =~ CryptoEncryptionRegex
        AND NOT EventData.ScriptBlockText =~ DetectionEngineeringNoiseRegex
        AND NOT EventData.ScriptBlockText =~ DocumentationNoiseRegex

  - name: CU009_Source_TEC009_Local_Archive_Staging_4104_Context
    description: |
      CU-009 / T1074.001 + T1560.001.
      Local archive staging context from PowerShell 4104.
      Does not assert HTTP exfiltration without upload evidence.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CU-009" AS CU_ID,
        "TEC-009" AS ID_Tecnica_Interna,
        "T1074.001 / T1560.001" AS MITRE_ID,
        "Collection" AS MITRE_Tactic,
        "Local archive staging context only; no HTTP transfer asserted without upload evidence." AS MITRE_Tactic_Context,
        "PowerShell 4104" AS SignalType,
        "Local Archive Staging Behavior" AS AlertName,
        "Medium" AS Severity,
        "P3" AS Priority,
        "Medium" AS Confidence,
        "PowerShell Script Block Logging" AS DetectionScope,
        "Context / Detection candidate" AS OutputType,
        "Medio" AS FP_Risk,
        "PowerShell script block shows local archive/staging behavior that may support CU-009 when correlated with upload or receiver evidence." AS CU_Reason,
        EventData.ScriptBlockText AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-PowerShell/Operational" AS Channel,
        System.Provider.Name AS Provider,
        "powershell.exe" AS Image,
        EventData.ScriptBlockText AS CommandLine,
        "" AS ParentImage,
        "" AS ParentCommandLine,
        EventData.UserId AS User,
        "" AS Hashes,
        "" AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        "" AS ParentProcessId,
        "" AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        "4104 context: Compress-Archive/System.IO.Compression/ZIP plus Copy-Item/Move-Item or destination staging; not classified as HTTP exfiltration" AS DetectionLogic,
        "No upload claim without HTTP upload indicators; excludes router self-events, PowerShell noise and encryption blocks" AS FalsePositiveReduction,
        "B6" AS BenchmarkScenario,
        "P3 Medium Behavioral v10" AS ArtifactProfile
      FROM watch_evtx(filename=PowerShellLog)
      WHERE atoi(string=System.EventID.Value) = 4104
        AND NOT EventData.ScriptBlockText =~ PSNoiseRegex
        AND NOT EventData.ScriptBlockText =~ RouterSelfRegex
        AND EventData.ScriptBlockText =~ StagingArchiveRegex
        AND EventData.ScriptBlockText =~ StagingCopyRegex
        AND NOT (
          EventData.ScriptBlockText =~ UploadHttpRegex
          AND EventData.ScriptBlockText =~ UploadFileRegex
          AND EventData.ScriptBlockText =~ UploadPostRegex
        )
        AND NOT EventData.ScriptBlockText =~ CryptoEncryptionRegex


