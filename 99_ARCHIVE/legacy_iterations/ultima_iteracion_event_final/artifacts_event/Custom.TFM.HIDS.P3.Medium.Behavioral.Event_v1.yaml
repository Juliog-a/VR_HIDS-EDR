# Version: Event v1 candidate
# Purpose:
# - Medium/noise-controlled live CLIENT_EVENT artifact for alerting.
# - Uses watch_evtx() because it must run before and during the campaign.
# - Normalized alert rows for TEC-001 to TEC-009.
# - Avoids lab paths, script names and technique labels as IOC filters.

name: Custom.TFM.HIDS.P3.Medium.Behavioral.Event_v1
description: |
  P3 Medium Behavioral Event v1 for live alerting.

  This is the primary CLIENT_EVENT artifact for the final TFM run. Activate it
  before launching runner v5. It emits normalized alert/candidate rows. TEC-009
  is HIGH confidence when PowerShell 4104 contains an HTTP upload tool plus
  file-upload and ZIP/upload evidence. Sysmon ID 1/3/11 are context/enrichment
  and never block a 4104 detection.

type: CLIENT_EVENT

parameters:
  - name: HostnameOverride
    default: ""
  - name: ClientIdOverride
    default: ""
  - name: PowerShellLog
    default: 'C:/Windows/System32/Winevt/Logs/Microsoft-Windows-PowerShell%4Operational.evtx'
  - name: SysmonLog
    default: 'C:/Windows/System32/Winevt/Logs/Microsoft-Windows-Sysmon%4Operational.evtx'
  - name: SystemLog
    default: 'C:/Windows/System32/Winevt/Logs/System.evtx'
  - name: ReceiverIP
    default: '192.168.1.129'
  - name: ReceiverPort
    default: 8088
    type: int
  - name: NoiseRegex
    default: '(?i)(alerts\.jsonl|RouterArtifact|JSONL_WRITE_ATTEMPT|ConvertFrom-Json|ConvertTo-Json|Custom\.TFM\.Debug|Get-WinEvent|UploadHttpRegex|CU009StrongCandidate|DetectionEngineeringNoiseRegex)'
    type: regex
  - name: WindowsScriptNoiseRegex
    default: '(?i)(CL_Utility\.ps1|ArchiveResources\.psd1|SDIAG_|Microsoft Corporation)'
    type: regex
  - name: ChromeAdobeNativeMessagingRegex
    default: '(?i)(WCChromeNativeMessagingHost\.exe|chrome\.nativeMessaging|Adobe\\Acrobat|Acrobat\\Browser|chrome-extension://)'
    type: regex
  - name: TEC001_PS_Strong
    default: '(?i)(ExecutionPolicy\s+Bypass|-EncodedCommand|FromBase64String|Invoke-Expression|\bIEX\b|DownloadString)'
    type: regex
  - name: TEC002_CMD
    default: '(?i)(\bcmd(?:\.exe)?\b.*\s/c\b.*(powershell|pwsh|whoami|echo|\s&\s)|\s&&\s|\s\|\|\s)'
    type: regex
  - name: TEC003_Task
    default: '(?i)(\bschtasks(?:\.exe)?\b.*(/create|/run|/delete|/change))'
    type: regex
  - name: TEC004_RunKey
    default: '(?i)(\breg(?:\.exe)?\b.*\b(add|delete)\b.*\\Software\\Microsoft\\Windows\\CurrentVersion\\(Run|RunOnce)|\\Software\\Microsoft\\Windows\\CurrentVersion\\(Run|RunOnce).*\b(add|delete)\b)'
    type: regex
  - name: TEC005_Service
    default: '(?i)(\bsc(?:\.exe)?\b.*\b(create|start|delete|config)\b|Service Control Manager)'
    type: regex
  - name: TEC006_Discovery
    default: '(?i)(SecurityCenter2|AntivirusProduct|AntiSpywareProduct|Windows Defender|Defender|WinDefend|SecurityHealthService|Get-CimInstance|Get-WmiObject|\bwmic\b)'
    type: regex
  - name: TEC007_CryptoStrong
    default: '(?i)(System\.Security\.Cryptography|Aes|CryptoStream|CreateEncryptor|Rfc2898DeriveBytes|\.aes\b)'
    type: regex
  - name: TEC008_DestructionStrong
    default: '(?is)((Get-ChildItem|gci|dir|ls).*(Remove-Item|del\s+|erase\s+|rmdir\s+).*(-Force|-Recurse|\$_\.FullName|\$PSItem\.FullName)|(Remove-Item|del\s+|erase\s+|rmdir\s+).*(-Force|-Recurse).*(Get-ChildItem|gci|dir|ls|\$_\.FullName|\$PSItem\.FullName))'
    type: regex
  - name: TEC009_HTTPTool
    default: '(?i)(Invoke-WebRequest|\biwr\b|\bwget\b|\bcurl\b|Invoke-RestMethod|WebClient|UploadFile)'
    type: regex
  - name: TEC009_FileUpload
    default: '(?i)(-InFile\b|\bInFile\b|UploadFile|--upload-file|--data-binary|--form|@\S+\.zip)'
    type: regex
  - name: TEC009_PostSignal
    default: '(?i)(-Method\s+POST|\bMethod\s+POST\b|\bPOST\b)'
    type: regex
  - name: TEC009_ZipUpload
    default: '(?i)(application/zip|\.zip\b|\bupload\b|ReceiverUrl)'
    type: regex
  - name: PowerShellImage
    default: '(?i)\\(powershell|pwsh)\.exe$'
    type: regex

precondition: SELECT OS FROM info() WHERE OS = "windows"

sources:
  - name: TEC001_PowerShell_4104
    description: |
      TEC-001 / T1059.001. Live PowerShell 4104 suspicious execution.
    query: |
      SELECT DetectionTime, Hostname, ClientIdOverride AS ClientId,
        "CU-001" AS CU_ID, "TEC-001" AS ID_Tecnica_Interna,
        "T1059.001" AS MITRE_ID, "Execution" AS MITRE_Tactic,
        "PowerShell 4104" AS SignalType,
        "TEC-001 PowerShell suspicious execution" AS AlertTitle,
        "PowerShell script block contains execution bypass, decoder or IEX-style behavior." AS AlertDescription,
        ScriptText AS Evidence, "Microsoft-Windows-PowerShell/Operational" AS Source,
        EventID, "HIGH" AS Confidence, "MEDIUM" AS Severity,
        "Review parent process and whether this was expected administrative automation." AS RecommendedAction
      FROM foreach(row={
        SELECT System.TimeCreated.SystemTime AS DetectionTime,
          if(condition=HostnameOverride =~ '(?s).+', then=HostnameOverride, else=System.Computer) AS Hostname,
          atoi(string=System.EventID.Value) AS EventID,
          if(condition=EventData.ScriptBlockText =~ '(?s).', then=EventData.ScriptBlockText, else=if(condition=Message =~ '(?s).', then=Message, else=serialize(item=EventData, format="json"))) AS ScriptText
        FROM watch_evtx(filename=PowerShellLog)
        WHERE atoi(string=System.EventID.Value) = 4104
      })
      WHERE ScriptText =~ TEC001_PS_Strong
        AND NOT ScriptText =~ NoiseRegex

  - name: TEC002_CMD_Sysmon
    description: |
      TEC-002 / T1059.003. Live cmd.exe chaining or PowerShell child execution.
    query: |
      SELECT DetectionTime, Hostname, ClientIdOverride AS ClientId,
        "CU-002" AS CU_ID, "TEC-002" AS ID_Tecnica_Interna,
        "T1059.003" AS MITRE_ID, "Execution" AS MITRE_Tactic,
        "Sysmon ID 1" AS SignalType,
        "TEC-002 Windows Command Shell execution" AS AlertTitle,
        "Process creation shows cmd.exe chaining or PowerShell child execution." AS AlertDescription,
        CommandText AS Evidence, "Microsoft-Windows-Sysmon/Operational" AS Source,
        EventID, "MEDIUM" AS Confidence, "MEDIUM" AS Severity,
        "Review the command line and child process tree." AS RecommendedAction
      FROM foreach(row={
        SELECT System.TimeCreated.SystemTime AS DetectionTime,
          if(condition=HostnameOverride =~ '(?s).+', then=HostnameOverride, else=System.Computer) AS Hostname,
          atoi(string=System.EventID.Value) AS EventID,
          if(condition=EventData.CommandLine =~ '(?s).', then=EventData.CommandLine, else=if(condition=Message =~ '(?s).', then=Message, else=serialize(item=EventData, format="json"))) AS CommandText
        FROM watch_evtx(filename=SysmonLog)
        WHERE atoi(string=System.EventID.Value) = 1
      })
      WHERE CommandText =~ TEC002_CMD
        AND NOT CommandText =~ ChromeAdobeNativeMessagingRegex
        AND NOT CommandText =~ NoiseRegex

  - name: TEC003_ScheduledTask_Sysmon
    description: |
      TEC-003 / T1053.005. Scheduled task lifecycle from Sysmon ID 1.
    query: |
      SELECT DetectionTime, Hostname, ClientIdOverride AS ClientId,
        "CU-003" AS CU_ID, "TEC-003" AS ID_Tecnica_Interna,
        "T1053.005" AS MITRE_ID, "Persistence" AS MITRE_Tactic,
        "Sysmon ID 1" AS SignalType,
        "TEC-003 Scheduled Task operation" AS AlertTitle,
        "schtasks.exe created, ran, changed or deleted a scheduled task." AS AlertDescription,
        CommandText AS Evidence, "Microsoft-Windows-Sysmon/Operational" AS Source,
        EventID, "MEDIUM" AS Confidence, "HIGH" AS Severity,
        "Inspect task action, author, trigger and cleanup behavior." AS RecommendedAction
      FROM foreach(row={
        SELECT System.TimeCreated.SystemTime AS DetectionTime,
          if(condition=HostnameOverride =~ '(?s).+', then=HostnameOverride, else=System.Computer) AS Hostname,
          atoi(string=System.EventID.Value) AS EventID,
          if(condition=EventData.CommandLine =~ '(?s).', then=EventData.CommandLine, else=if(condition=Message =~ '(?s).', then=Message, else=serialize(item=EventData, format="json"))) AS CommandText
        FROM watch_evtx(filename=SysmonLog)
        WHERE atoi(string=System.EventID.Value) = 1
      })
      WHERE CommandText =~ TEC003_Task

  - name: TEC004_RunKey_Sysmon
    description: |
      TEC-004 / T1547.001. Run/RunOnce persistence from process command line.
    query: |
      SELECT DetectionTime, Hostname, ClientIdOverride AS ClientId,
        "CU-004" AS CU_ID, "TEC-004" AS ID_Tecnica_Interna,
        "T1547.001" AS MITRE_ID, "Persistence" AS MITRE_Tactic,
        "Sysmon ID 1" AS SignalType,
        "TEC-004 Registry Run Key modification" AS AlertTitle,
        "reg.exe modifies Run or RunOnce autostart locations." AS AlertDescription,
        CommandText AS Evidence, "Microsoft-Windows-Sysmon/Operational" AS Source,
        EventID, "MEDIUM" AS Confidence, "HIGH" AS Severity,
        "Review value name, target executable and whether the modification is expected." AS RecommendedAction
      FROM foreach(row={
        SELECT System.TimeCreated.SystemTime AS DetectionTime,
          if(condition=HostnameOverride =~ '(?s).+', then=HostnameOverride, else=System.Computer) AS Hostname,
          atoi(string=System.EventID.Value) AS EventID,
          if(condition=EventData.CommandLine =~ '(?s).', then=EventData.CommandLine, else=if(condition=Message =~ '(?s).', then=Message, else=serialize(item=EventData, format="json"))) AS CommandText
        FROM watch_evtx(filename=SysmonLog)
        WHERE atoi(string=System.EventID.Value) = 1
      })
      WHERE CommandText =~ TEC004_RunKey

  - name: TEC005_Service_System7045
    description: |
      TEC-005 / T1569.002. Service creation from System Event ID 7045.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        if(condition=HostnameOverride =~ '(?s).+', then=HostnameOverride, else=System.Computer) AS Hostname,
        ClientIdOverride AS ClientId,
        "CU-005" AS CU_ID, "TEC-005" AS ID_Tecnica_Interna,
        "T1569.002" AS MITRE_ID, "Execution" AS MITRE_Tactic,
        "System 7045" AS SignalType,
        "TEC-005 Windows service creation" AS AlertTitle,
        "System log shows a service installation event." AS AlertDescription,
        serialize(item=EventData, format="json") AS Evidence,
        "System" AS Source,
        atoi(string=System.EventID.Value) AS EventID,
        "HIGH" AS Confidence,
        "HIGH" AS Severity,
        "Review service name, ImagePath, account and whether the service is temporary or unexpected." AS RecommendedAction
      FROM watch_evtx(filename=SystemLog)
      WHERE atoi(string=System.EventID.Value) = 7045

  - name: TEC006_SecuritySoftwareDiscovery_4104
    description: |
      TEC-006 / T1518.001. Security software discovery from PowerShell 4104.
    query: |
      SELECT DetectionTime, Hostname, ClientIdOverride AS ClientId,
        "CU-006" AS CU_ID, "TEC-006" AS ID_Tecnica_Interna,
        "T1518.001" AS MITRE_ID, "Discovery" AS MITRE_Tactic,
        "PowerShell 4104" AS SignalType,
        "TEC-006 Security Software Discovery" AS AlertTitle,
        "PowerShell queries security product or Defender-related inventory." AS AlertDescription,
        ScriptText AS Evidence, "Microsoft-Windows-PowerShell/Operational" AS Source,
        EventID, "HIGH" AS Confidence, "MEDIUM" AS Severity,
        "Check whether security inventory was expected administrative activity." AS RecommendedAction
      FROM foreach(row={
        SELECT System.TimeCreated.SystemTime AS DetectionTime,
          if(condition=HostnameOverride =~ '(?s).+', then=HostnameOverride, else=System.Computer) AS Hostname,
          atoi(string=System.EventID.Value) AS EventID,
          if(condition=EventData.ScriptBlockText =~ '(?s).', then=EventData.ScriptBlockText, else=if(condition=Message =~ '(?s).', then=Message, else=serialize(item=EventData, format="json"))) AS ScriptText
        FROM watch_evtx(filename=PowerShellLog)
        WHERE atoi(string=System.EventID.Value) = 4104
      })
      WHERE ScriptText =~ TEC006_Discovery
        AND NOT ScriptText =~ NoiseRegex

  - name: TEC006_SecuritySoftwareDiscovery_Sysmon
    description: |
      TEC-006 fallback/context if discovery appears only as process command line.
    query: |
      SELECT DetectionTime, Hostname, ClientIdOverride AS ClientId,
        "CU-006" AS CU_ID, "TEC-006" AS ID_Tecnica_Interna,
        "T1518.001 context" AS MITRE_ID, "Discovery context" AS MITRE_Tactic,
        "Sysmon ID 1" AS SignalType,
        "TEC-006 Security Software Discovery process context" AS AlertTitle,
        "Process creation command line queries security product or Defender inventory." AS AlertDescription,
        CommandText AS Evidence, "Microsoft-Windows-Sysmon/Operational" AS Source,
        EventID, "MEDIUM" AS Confidence, "MEDIUM" AS Severity,
        "Correlate with PowerShell 4104 if available." AS RecommendedAction
      FROM foreach(row={
        SELECT System.TimeCreated.SystemTime AS DetectionTime,
          if(condition=HostnameOverride =~ '(?s).+', then=HostnameOverride, else=System.Computer) AS Hostname,
          atoi(string=System.EventID.Value) AS EventID,
          if(condition=EventData.CommandLine =~ '(?s).', then=EventData.CommandLine, else=if(condition=Message =~ '(?s).', then=Message, else=serialize(item=EventData, format="json"))) AS CommandText
        FROM watch_evtx(filename=SysmonLog)
        WHERE atoi(string=System.EventID.Value) = 1
      })
      WHERE CommandText =~ TEC006_Discovery
        AND NOT CommandText =~ NoiseRegex

  - name: TEC007_DataEncryptedForImpact_4104
    description: |
      TEC-007 / T1486. Strong 4104 crypto/file-impact evidence.
      Sysmon ID 11 .aes is optional context, not required.
    query: |
      SELECT DetectionTime, Hostname, ClientIdOverride AS ClientId,
        "CU-007" AS CU_ID, "TEC-007" AS ID_Tecnica_Interna,
        "T1486" AS MITRE_ID, "Impact" AS MITRE_Tactic,
        "PowerShell 4104" AS SignalType,
        "TEC-007 Data Encrypted for Impact" AS AlertTitle,
        "PowerShell script block contains AES/CryptoStream/CreateEncryptor or encrypted-extension behavior." AS AlertDescription,
        ScriptText AS Evidence, "Microsoft-Windows-PowerShell/Operational" AS Source,
        EventID, "HIGH" AS Confidence, "HIGH" AS Severity,
        "Confirm scope is limited to dummy/lab files and review generated encrypted artifacts." AS RecommendedAction
      FROM foreach(row={
        SELECT System.TimeCreated.SystemTime AS DetectionTime,
          if(condition=HostnameOverride =~ '(?s).+', then=HostnameOverride, else=System.Computer) AS Hostname,
          atoi(string=System.EventID.Value) AS EventID,
          if(condition=EventData.ScriptBlockText =~ '(?s).', then=EventData.ScriptBlockText, else=if(condition=Message =~ '(?s).', then=Message, else=serialize(item=EventData, format="json"))) AS ScriptText
        FROM watch_evtx(filename=PowerShellLog)
        WHERE atoi(string=System.EventID.Value) = 4104
      })
      WHERE ScriptText =~ TEC007_CryptoStrong
        AND NOT ScriptText =~ NoiseRegex

  - name: TEC008_DataDestruction_4104
    description: |
      TEC-008 / T1485. Strong destructive deletion evidence from 4104.
      Sysmon ID 23/26 is forensic evidence only and is not required.
    query: |
      SELECT DetectionTime, Hostname, ClientIdOverride AS ClientId,
        "CU-008" AS CU_ID, "TEC-008" AS ID_Tecnica_Interna,
        "T1485" AS MITRE_ID, "Impact" AS MITRE_Tactic,
        "PowerShell 4104" AS SignalType,
        "TEC-008 Data Destruction" AS AlertTitle,
        "PowerShell script block combines enumeration and forced or recursive deletion behavior." AS AlertDescription,
        ScriptText AS Evidence, "Microsoft-Windows-PowerShell/Operational" AS Source,
        EventID, "HIGH" AS Confidence, "HIGH" AS Severity,
        "Review deletion scope and validate whether affected files are controlled test data." AS RecommendedAction
      FROM foreach(row={
        SELECT System.TimeCreated.SystemTime AS DetectionTime,
          if(condition=HostnameOverride =~ '(?s).+', then=HostnameOverride, else=System.Computer) AS Hostname,
          atoi(string=System.EventID.Value) AS EventID,
          if(condition=EventData.ScriptBlockText =~ '(?s).', then=EventData.ScriptBlockText, else=if(condition=Message =~ '(?s).', then=Message, else=serialize(item=EventData, format="json"))) AS ScriptText
        FROM watch_evtx(filename=PowerShellLog)
        WHERE atoi(string=System.EventID.Value) = 4104
      })
      WHERE ScriptText =~ TEC008_DestructionStrong
        AND NOT ScriptText =~ TEC007_CryptoStrong
        AND NOT ScriptText =~ WindowsScriptNoiseRegex
        AND NOT ScriptText =~ NoiseRegex

  - name: TEC009_HTTP_ZIP_Upload_4104
    description: |
      TEC-009 / T1074.001 + T1560.001 + T1048.003.
      Strong live 4104 condition: HTTP upload tool AND file-upload evidence
      AND ZIP/upload evidence. POST is positive evidence but is not a blocker.
      Sysmon ID 3 is context only.
    query: |
      SELECT DetectionTime, Hostname, ClientIdOverride AS ClientId,
        "CU-009" AS CU_ID, "TEC-009" AS ID_Tecnica_Interna,
        "T1074.001 / T1560.001 / T1048.003" AS MITRE_ID,
        "Collection / Exfiltration" AS MITRE_Tactic,
        "PowerShell 4104" AS SignalType,
        "TEC-009 Controlled HTTP ZIP Upload" AS AlertTitle,
        "PowerShell script block shows HTTP upload of a ZIP-like input file. Network telemetry is contextual only." AS AlertDescription,
        ScriptText AS Evidence, "Microsoft-Windows-PowerShell/Operational" AS Source,
        EventID, "HIGH" AS Confidence, "HIGH" AS Severity,
        "Validate receiver logs and ZIP hash if available; do not require Sysmon ID 3 to accept the detection." AS RecommendedAction
      FROM foreach(row={
        SELECT System.TimeCreated.SystemTime AS DetectionTime,
          if(condition=HostnameOverride =~ '(?s).+', then=HostnameOverride, else=System.Computer) AS Hostname,
          atoi(string=System.EventID.Value) AS EventID,
          if(condition=EventData.ScriptBlockText =~ '(?s).', then=EventData.ScriptBlockText, else=if(condition=Message =~ '(?s).', then=Message, else=serialize(item=EventData, format="json"))) AS ScriptText
        FROM watch_evtx(filename=PowerShellLog)
        WHERE atoi(string=System.EventID.Value) = 4104
      })
      WHERE ScriptText =~ TEC009_HTTPTool
        AND ScriptText =~ TEC009_FileUpload
        AND ScriptText =~ TEC009_ZipUpload
        AND NOT ScriptText =~ TEC007_CryptoStrong
        AND NOT ScriptText =~ NoiseRegex

  - name: TEC009_HTTP_Upload_Sysmon_Process_Context
    description: |
      TEC-009 process context from Sysmon ID 1. Does not use script name as IOC.
    query: |
      SELECT DetectionTime, Hostname, ClientIdOverride AS ClientId,
        "CU-009" AS CU_ID, "TEC-009" AS ID_Tecnica_Interna,
        "T1074.001 / T1560.001 / T1048.003 context" AS MITRE_ID,
        "Collection / Exfiltration context" AS MITRE_Tactic,
        "Sysmon ID 1" AS SignalType,
        "TEC-009 HTTP upload process context" AS AlertTitle,
        "PowerShell process command line contains file execution/upload parameters or HTTP upload indicators." AS AlertDescription,
        CommandText AS Evidence, "Microsoft-Windows-Sysmon/Operational" AS Source,
        EventID, "MEDIUM" AS Confidence, "HIGH" AS Severity,
        "Use as context; the primary alert is TEC009_HTTP_ZIP_Upload_4104." AS RecommendedAction
      FROM foreach(row={
        SELECT System.TimeCreated.SystemTime AS DetectionTime,
          if(condition=HostnameOverride =~ '(?s).+', then=HostnameOverride, else=System.Computer) AS Hostname,
          atoi(string=System.EventID.Value) AS EventID,
          EventData.Image AS Image,
          if(condition=EventData.CommandLine =~ '(?s).', then=EventData.CommandLine, else=if(condition=Message =~ '(?s).', then=Message, else=serialize(item=EventData, format="json"))) AS CommandText
        FROM watch_evtx(filename=SysmonLog)
        WHERE atoi(string=System.EventID.Value) = 1
      })
      WHERE Image =~ PowerShellImage
        AND (
          CommandText =~ '(?i)(-File|-Command)'
          AND CommandText =~ '(?i)(ReceiverUrl|EnableUpload|Invoke-WebRequest|\biwr\b|Invoke-RestMethod|-InFile|application/zip|\.zip\b)'
        )
        AND NOT CommandText =~ NoiseRegex

  - name: TEC009_HTTP_Network_Sysmon_Context
    description: |
      TEC-009 network context only. Absence of this row must not invalidate 4104.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        if(condition=HostnameOverride =~ '(?s).+', then=HostnameOverride, else=System.Computer) AS Hostname,
        ClientIdOverride AS ClientId,
        "CU-009" AS CU_ID, "TEC-009" AS ID_Tecnica_Interna,
        "T1048.003 context" AS MITRE_ID,
        "Exfiltration context" AS MITRE_Tactic,
        "Sysmon ID 3" AS SignalType,
        "TEC-009 receiver network context" AS AlertTitle,
        "PowerShell network connection to configured receiver. This is context, not a blocking condition." AS AlertDescription,
        serialize(item=EventData, format="json") AS Evidence,
        "Microsoft-Windows-Sysmon/Operational" AS Source,
        atoi(string=System.EventID.Value) AS EventID,
        "MEDIUM" AS Confidence,
        "HIGH" AS Severity,
        "Correlate with the 4104 upload row if present; absence of this row does not invalidate TEC-009." AS RecommendedAction
      FROM watch_evtx(filename=SysmonLog)
      WHERE atoi(string=System.EventID.Value) = 3
        AND EventData.Image =~ PowerShellImage
        AND EventData.DestinationIp = ReceiverIP
        AND atoi(string=EventData.DestinationPort) = ReceiverPort

  - name: TEC009_ZIP_FileCreate_Sysmon_Context
    description: |
      TEC-009 ZIP file creation context from Sysmon ID 11.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        if(condition=HostnameOverride =~ '(?s).+', then=HostnameOverride, else=System.Computer) AS Hostname,
        ClientIdOverride AS ClientId,
        "CU-009" AS CU_ID, "TEC-009" AS ID_Tecnica_Interna,
        "T1560.001 context" AS MITRE_ID,
        "Collection context" AS MITRE_Tactic,
        "Sysmon ID 11" AS SignalType,
        "TEC-009 ZIP file creation context" AS AlertTitle,
        "ZIP-like file creation observed. This supports staging/archive but is not sufficient alone." AS AlertDescription,
        EventData.TargetFilename AS Evidence,
        "Microsoft-Windows-Sysmon/Operational" AS Source,
        atoi(string=System.EventID.Value) AS EventID,
        "MEDIUM" AS Confidence,
        "HIGH" AS Severity,
        "Correlate with TEC009_HTTP_ZIP_Upload_4104 and runner summary." AS RecommendedAction
      FROM watch_evtx(filename=SysmonLog)
      WHERE atoi(string=System.EventID.Value) = 11
        AND EventData.TargetFilename =~ '(?i)\.zip\b'
