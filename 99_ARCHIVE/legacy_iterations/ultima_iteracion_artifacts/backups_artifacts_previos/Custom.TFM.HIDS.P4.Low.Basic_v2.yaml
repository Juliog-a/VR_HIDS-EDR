# Version: v2 candidate
# Changes:
# - Adds bounded exclusions for router JSONL self-events in CU-001.
# - Adds bounded Chrome/Adobe Native Messaging exclusion in CU-002.
# - Keeps CU-003/CU-004/CU-005 behavior unchanged.
# - Does not use lab paths, script names, DUMB_LAB or TEC labels as IOC.

name: Custom.TFM.HIDS.P4.Low.Basic_v2
description: |
  Candidate v2 for P4 Low Basic.

  Scope:
  - Low-cost host visibility and basic detection from Sysmon process creation
    and Windows service creation.
  - P4 remains a noisy/basic profile by design.
  - Router and JSONL are outputs, not detection logic.

  Version notes:
  - CU-001 excludes PowerShell self-events generated by the JSONL router.
  - CU-002 excludes the observed Chrome/Adobe Native Messaging false positive
    in a narrow way.
  - CU-003, CU-004 and CU-005 remain as specific basic detections.

type: CLIENT_EVENT

parameters:
  - name: HostnameOverride
    default: LT29.ait.us.es
  - name: ClientIdOverride
    default: C.364907172793f8c7
  - name: SysmonLog
    default: C:/Windows/System32/Winevt/Logs/Microsoft-Windows-Sysmon%4Operational.evtx
  - name: SystemLog
    default: C:/Windows/System32/Winevt/Logs/System.evtx
  - name: SuspiciousPSRegex
    default: (?i)(-nop|-noprofile|executionpolicy\s+bypass|-encodedcommand|\biex\b|downloadstring|invoke-webrequest|iwr|invoke-expression|webclient)
    type: regex
  - name: RouterSelfEventRegex
    default: (?i)(alerts\.jsonl|FromBase64String|Add-Content|RouterArtifact|JSONL_WRITE_ATTEMPT|ConvertFrom-Json|ConvertTo-Json)
    type: regex
  - name: CmdSuspiciousRegex
    default: (?i)(/c|&&|\|\||\||powershell|pwsh|certutil|bitsadmin|rundll32|reg\s+add|schtasks|sc\s+create|wmic|net\s+)
    type: regex
  - name: ChromeAdobeNativeMessagingRegex
    default: (?i)(WCChromeNativeMessagingHost\.exe|chrome\.nativeMessaging|Adobe\\Acrobat|Acrobat\\Browser|chrome-extension://)
    type: regex
  - name: RunKeyRegex
    default: (?i)\\Software\\Microsoft\\Windows\\CurrentVersion\\(Run|RunOnce)
    type: regex

precondition: SELECT OS FROM info() WHERE OS = "windows"

sources:
  - name: CU001_Source_TEC001_PowerShell_Basic
    description: |
      CU-001 / T1059.001.
      Basic suspicious PowerShell command-line detection.
      Excludes router JSONL self-events; does not exclude PowerShell Bypass globally.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CU-001" AS CU_ID,
        "TEC-001" AS ID_Tecnica_Interna,
        "T1059.001" AS MITRE_ID,
        "Execution" AS MITRE_Tactic,
        "" AS MITRE_Tactic_Context,
        "ProcessCreation" AS SignalType,
        "PowerShell suspicious execution - basic profile v2" AS AlertName,
        "Medium" AS Severity,
        "P3" AS Priority,
        "Medium" AS Confidence,
        "Host-based process creation" AS DetectionScope,
        "Deteccion / Alerta RT si se enruta" AS OutputType,
        "Medio" AS FP_Risk,
        "powershell.exe/pwsh.exe with suspicious execution flags or command patterns" AS CU_Reason,
        EventData.CommandLine AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-Sysmon/Operational" AS Channel,
        System.Provider.Name AS Provider,
        EventData.Image AS Image,
        EventData.CommandLine AS CommandLine,
        EventData.ParentImage AS ParentImage,
        EventData.ParentCommandLine AS ParentCommandLine,
        EventData.User AS User,
        EventData.Hashes AS Hashes,
        EventData.ProcessGuid AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        EventData.ParentProcessId AS ParentProcessId,
        "" AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        "Sysmon ID 1 + PowerShell image + suspicious flags; excludes router JSONL self-events" AS DetectionLogic,
        "Router JSONL self-events excluded by Add-Content/FromBase64String/alerts.jsonl pattern; PowerShell Bypass remains visible otherwise" AS FalsePositiveReduction,
        "B5" AS BenchmarkScenario,
        "P4 Low Basic v2" AS ArtifactProfile
      FROM watch_evtx(filename=SysmonLog)
      WHERE atoi(string=System.EventID.Value) = 1
        AND EventData.Image =~ "(?i)\\\\(powershell|pwsh)\\.exe$"
        AND EventData.CommandLine =~ SuspiciousPSRegex
        AND NOT (
          EventData.CommandLine =~ RouterSelfEventRegex
          AND EventData.CommandLine =~ "(?i)(-NonInteractive|Add-Content|FromBase64String|alerts\\.jsonl)"
        )

  - name: CU002_Source_TEC002_CMD_Basic
    description: |
      CU-002 / T1059.003.
      Basic suspicious cmd.exe command-line detection.
      Excludes only the bounded Chrome/Adobe Native Messaging pattern.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CU-002" AS CU_ID,
        "TEC-002" AS ID_Tecnica_Interna,
        "T1059.003" AS MITRE_ID,
        "Execution" AS MITRE_Tactic,
        "" AS MITRE_Tactic_Context,
        "ProcessCreation" AS SignalType,
        "Windows Command Shell suspicious execution - basic profile v2" AS AlertName,
        "Medium" AS Severity,
        "P3" AS Priority,
        "Medium" AS Confidence,
        "Host-based process creation" AS DetectionScope,
        "Deteccion / Alerta RT si se enruta" AS OutputType,
        "Medio" AS FP_Risk,
        "cmd.exe with chaining, PowerShell or administrative tool usage" AS CU_Reason,
        EventData.CommandLine AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-Sysmon/Operational" AS Channel,
        System.Provider.Name AS Provider,
        EventData.Image AS Image,
        EventData.CommandLine AS CommandLine,
        EventData.ParentImage AS ParentImage,
        EventData.ParentCommandLine AS ParentCommandLine,
        EventData.User AS User,
        EventData.Hashes AS Hashes,
        EventData.ProcessGuid AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        EventData.ParentProcessId AS ParentProcessId,
        "" AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        "Sysmon ID 1 + cmd.exe + chaining/dual-use regex; bounded Native Messaging FP exclusion" AS DetectionLogic,
        "Does not exclude cmd.exe globally; only chrome.exe parent plus Adobe/Chrome Native Messaging command-line pattern" AS FalsePositiveReduction,
        "B5" AS BenchmarkScenario,
        "P4 Low Basic v2" AS ArtifactProfile
      FROM watch_evtx(filename=SysmonLog)
      WHERE atoi(string=System.EventID.Value) = 1
        AND EventData.Image =~ "(?i)\\\\cmd\\.exe$"
        AND EventData.CommandLine =~ CmdSuspiciousRegex
        AND NOT (
          EventData.ParentImage =~ "(?i)\\\\chrome\\.exe$"
          AND (
            EventData.CommandLine =~ ChromeAdobeNativeMessagingRegex
            OR EventData.ParentCommandLine =~ ChromeAdobeNativeMessagingRegex
          )
        )

  - name: CU003_Source_TEC003_ScheduledTask_Basic
    description: CU-003 / T1053.005. Scheduled task process creation via schtasks.exe.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CU-003" AS CU_ID,
        "TEC-003" AS ID_Tecnica_Interna,
        "T1053.005" AS MITRE_ID,
        "Execution" AS MITRE_Tactic,
        "Persistence; Privilege Escalation" AS MITRE_Tactic_Context,
        "ProcessCreation" AS SignalType,
        "Scheduled Task operation detected - basic profile v2" AS AlertName,
        "High" AS Severity,
        "P2" AS Priority,
        "Medium" AS Confidence,
        "Host-based process creation" AS DetectionScope,
        "Deteccion / Alerta RT si se enruta" AS OutputType,
        "Medio" AS FP_Risk,
        "schtasks.exe with create/run/delete/change action" AS CU_Reason,
        EventData.CommandLine AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-Sysmon/Operational" AS Channel,
        System.Provider.Name AS Provider,
        EventData.Image AS Image,
        EventData.CommandLine AS CommandLine,
        EventData.ParentImage AS ParentImage,
        EventData.ParentCommandLine AS ParentCommandLine,
        EventData.User AS User,
        EventData.Hashes AS Hashes,
        EventData.ProcessGuid AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        EventData.ParentProcessId AS ParentProcessId,
        "" AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        "Sysmon ID 1 + schtasks.exe + operational action" AS DetectionLogic,
        "Specific schtasks.exe source; generic cmd.exe overlap remains secondary visibility" AS FalsePositiveReduction,
        "B5" AS BenchmarkScenario,
        "P4 Low Basic v2" AS ArtifactProfile
      FROM watch_evtx(filename=SysmonLog)
      WHERE atoi(string=System.EventID.Value) = 1
        AND EventData.Image =~ "(?i)\\\\schtasks\\.exe$"
        AND EventData.CommandLine =~ "(?i)(/create|/run|/delete|/change)"

  - name: CU004_Source_TEC004_RunKeys_Basic
    description: CU-004 / T1547.001. Run/RunOnce modification by reg.exe.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CU-004" AS CU_ID,
        "TEC-004" AS ID_Tecnica_Interna,
        "T1547.001" AS MITRE_ID,
        "Persistence" AS MITRE_Tactic,
        "Privilege Escalation" AS MITRE_Tactic_Context,
        "ProcessCreation" AS SignalType,
        "Registry Run Key modification by reg.exe - basic profile v2" AS AlertName,
        "High" AS Severity,
        "P2" AS Priority,
        "Medium" AS Confidence,
        "Host-based process creation" AS DetectionScope,
        "Deteccion / Alerta RT si se enruta" AS OutputType,
        "Medio" AS FP_Risk,
        "reg.exe modifying Run/RunOnce" AS CU_Reason,
        EventData.CommandLine AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "Microsoft-Windows-Sysmon/Operational" AS Channel,
        System.Provider.Name AS Provider,
        EventData.Image AS Image,
        EventData.CommandLine AS CommandLine,
        EventData.ParentImage AS ParentImage,
        EventData.ParentCommandLine AS ParentCommandLine,
        EventData.User AS User,
        EventData.Hashes AS Hashes,
        EventData.ProcessGuid AS ProcessGuid,
        EventData.ProcessId AS ProcessId,
        EventData.ParentProcessId AS ParentProcessId,
        "" AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        "Sysmon ID 1 + reg.exe + Run/RunOnce" AS DetectionLogic,
        "Legitimate installers may modify Run Keys; review image/user/path context" AS FalsePositiveReduction,
        "B5" AS BenchmarkScenario,
        "P4 Low Basic v2" AS ArtifactProfile
      FROM watch_evtx(filename=SysmonLog)
      WHERE atoi(string=System.EventID.Value) = 1
        AND EventData.Image =~ "(?i)\\\\reg\\.exe$"
        AND EventData.CommandLine =~ "(?i)(add|delete|query)"
        AND EventData.CommandLine =~ RunKeyRegex

  - name: CU005_Source_TEC005_ServiceCreation_7045
    description: CU-005 / T1569.002. Windows service creation by EventID 7045.
    query: |
      SELECT
        System.TimeCreated.SystemTime AS DetectionTime,
        ClientIdOverride AS ClientId,
        HostnameOverride AS Hostname,
        "CU-005" AS CU_ID,
        "TEC-005" AS ID_Tecnica_Interna,
        "T1569.002" AS MITRE_ID,
        "Execution" AS MITRE_Tactic,
        "" AS MITRE_Tactic_Context,
        "Windows System Event 7045" AS SignalType,
        "Windows service creation detected - basic profile v2" AS AlertName,
        "High" AS Severity,
        "P2" AS Priority,
        "High" AS Confidence,
        "Host-based Windows Event Log" AS DetectionScope,
        "Deteccion / Alerta RT si se enruta" AS OutputType,
        "Bajo/Medio" AS FP_Risk,
        "EventID 7045 indicates service installation" AS CU_Reason,
        EventData.ImagePath AS CU_Evidence,
        atoi(string=System.EventID.Value) AS EventID,
        "System" AS Channel,
        System.Provider.Name AS Provider,
        EventData.ImagePath AS Image,
        EventData.ImagePath AS CommandLine,
        "" AS ParentImage,
        "" AS ParentCommandLine,
        "" AS User,
        "" AS Hashes,
        "" AS ProcessGuid,
        "" AS ProcessId,
        "" AS ParentProcessId,
        EventData.ServiceName AS TargetFilename,
        "" AS DestinationIp,
        "" AS DestinationPort,
        "" AS DestinationHostname,
        "System.evtx + EventID 7045" AS DetectionLogic,
        "Review legitimate updater/corporate services" AS FalsePositiveReduction,
        "B5" AS BenchmarkScenario,
        "P4 Low Basic v2" AS ArtifactProfile
      FROM watch_evtx(filename=SystemLog)
      WHERE atoi(string=System.EventID.Value) = 7045
